<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NetSec">
  <!-- NetSec favicon — mirrors the in-header .brand-mark style:
       rounded square in the EU-blue → Apple-blue gradient with "NS"
       in white. Designed to read cleanly at 16, 32, 48 px. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003399"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <text x="32" y="43"
        text-anchor="middle"
        font-family="'Lexend','Helvetica Neue',Arial,sans-serif"
        font-weight="800"
        font-size="26"
        letter-spacing="-0.5"
        fill="#ffffff">NS</text>
</svg>
