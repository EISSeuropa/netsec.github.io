<style>
  .err-page{
    min-height:100vh;
    display:grid;place-items:center;
    padding:60px 24px;text-align:center;
    color:var(--ink);
  }
  .err-page .glass{padding:48px 36px;max-width:560px;width:100%}

  /* Decorative illustration above the 404. A 12-star EU emblem ring
     drawn over a faint outline of the European continent, with the
     top arc of the ring "broken": three stars (11, 12 and 1 o'clock)
     are gone and small clouds of yellow fragments drift up from each
     gap. The metaphor: a piece of the Union's emblem has come loose,
     a quiet on-theme way of saying *something here is missing*. The
     continent outline is the Natural Earth 110m admin-0 dataset
     (public domain), the same map the EISS site uses on its
     initiative page. aria-hidden because the visible "404" + "Page
     not found" text already convey the message verbally. */
  /* The 10:7 viewBox matches the EISS conference map. The card is
     560 px wide with 36 px padding each side, so the content box is
     ~488 px; a 520 px cap is therefore above the available width and
     lets `width:100%` fill the content box edge to edge. Earlier caps
     (340 px, then 460 px) left the continent reading slightly pinched
     against the card; filling the full content width gives it room. */
  .err-illu{
    display:block;width:100%;max-width:520px;height:auto;
    margin:0 auto 16px;
  }
  /* Faint pale continent so the broken star-ring reads as the hero.
     Mirrors the EISS map-outline palette, adapted to NetSec's .dark
     class convention for theme switching. */
  .err-illu-map path{
    fill:hsl(216 34% 90%);
    stroke:hsl(216 20% 80%);
    stroke-width:1;stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
  }
  .dark .err-illu-map path{
    fill:hsl(216 24% 28%);
    stroke:hsl(216 14% 36%);
  }
  /* The broken-star fragments are blown left-to-right, as if a wind
     is carrying the loose pieces of the emblem off the page. Each
     fragment streams in from slightly down-and-left, drifts up and to
     the right, then fades, on a continuous loop. Per-fragment delays
     spread the cluster across the cycle so motion never stalls, and
     `--frag-peak` carries each circle's resting opacity (set inline,
     matched to its `opacity` attribute) so the depth of the original
     cloud survives the animation. Honoured by prefers-reduced-motion
     below, where the fragments fall back to their static attribute
     opacity with no transform. */
  .err-illu-fragments circle{
    animation:err-illu-windblow 5s ease-in-out infinite;
    transform-box:fill-box;
  }
  .err-illu-fragments circle:nth-child(2){animation-delay:.5s}
  .err-illu-fragments circle:nth-child(3){animation-delay:1s}
  .err-illu-fragments circle:nth-child(4){animation-delay:1.5s}
  .err-illu-fragments circle:nth-child(5){animation-delay:2s}
  .err-illu-fragments circle:nth-child(6){animation-delay:2.5s}
  .err-illu-fragments circle:nth-child(7){animation-delay:3s}
  .err-illu-fragments circle:nth-child(8){animation-delay:3.5s}
  .err-illu-fragments circle:nth-child(9){animation-delay:4s}
  .err-illu-fragments circle:nth-child(10){animation-delay:4.5s}
  @keyframes err-illu-windblow{
    0%   { transform: translate(-8px, 4px);  opacity: 0; }
    18%  { opacity: var(--frag-peak, .6); }
    72%  { opacity: var(--frag-peak, .6); }
    100% { transform: translate(42px, -22px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce){
    .err-illu-fragments circle{animation:none}
  }

  .err-code{
    font-family:'Lexend','Inter',sans-serif;font-weight:700;
    font-size:clamp(4rem,12vw,7rem);line-height:1;letter-spacing:-.05em;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));

  }
  .err-page h1{

  }
  .err-page p{color:var(--ink-2);font-size:1rem;margin:0 0 24px;line-height:1.55}
  .err-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
  /* Override the global .btn-ghost border, which uses --glass-border
     (intentionally faint for floating-glass UI elsewhere on the
     site) and read as near-invisible against the err-page glass
     card in both themes. Scoped to the 404 actions so we don't
     restyle ghost buttons elsewhere. */
  .err-actions .btn-ghost{
    border-color:var(--line);background:transparent;
  }
  .dark .err-actions .btn-ghost{
    border-color:rgba(255,255,255,.22);background:transparent;color:var(--ink);
  }
  /* Sit the language switcher visually clear of the action buttons.
     Earlier passes (#289, #293, #295, #299) bumped a bare `.err-lang`
     margin-top from 28 px up to 80 px and none of it took: `.err-lang`
     is a paragraph, and `.err-page p { margin:0 0 24px }` above has
     higher specificity (0,1,1 vs 0,1,0), so it reset margin-top to 0
     every time. Qualifying the selector with `.err-page` (0,2,0) wins
     the cascade, so the gap finally applies. 48 px reads as a
     meta-footer rather than a sibling of the buttons. (A border-top
     separator was tried in #289 and reverted as too rule-like against
     the glass card; pure whitespace works here.) */
  .err-page .err-lang{
    margin-top:48px;
    font-size:.85rem;color:var(--muted);
  }
  .err-lang a{color:var(--accent-2);text-decoration:underline;margin:0 6px}
  /* The currently-active language reads as a label, not a link;
     keeps the click target visible but removes the "navigate"
     affordance for the no-op case. */
  .err-lang a[aria-current="page"]{
    color:var(--ink);font-weight:600;text-decoration:none;cursor:default;
  }

  /* Inline mini-search on the 404 page. We deliberately do NOT use
     Pagefind's bundled `pagefind-ui` here — the default UI renders
     every `meta.*` key it finds as a `TitleCase: value` chip below
     the result, which exposed our internal bio-stub plumbing
     (Country: ch, Wgs: 2,3, Photo: /assets/…) as visible UI, and
     has no dark-mode CSS coverage. Instead we call Pagefind's
     low-level API and reuse the same `.search-result-*` /
     `.search-bio-*` classes that the Cmd-K overlay uses — those
     already carry dark-mode rules and a polished bio-card layout.
     Pagefind itself is built at deploy time into `/pagefind/`; on
     local dev the module import 404s and the whole search block
     hides itself (the two action buttons below still cover the
     "where do I go" need). */
  .err-search-prompt{margin:0 0 12px;font-size:.95rem}
  .err-search-mount{margin:0 auto 6px;max-width:520px;text-align:left}
  .err-search-bar{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    border:1px solid var(--line);border-radius:10px;
    background:var(--glass-bg);
  }
  .err-search-bar:focus-within{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  .err-search-bar .search-input{font-size:.95rem}
  .err-search-bar .search-close{width:28px;height:28px}
  .err-search-bar .search-close svg{width:14px;height:14px}
  /* Tighter chrome than the Cmd-K modal — the 404 sits inside the
     glass card already, so an extra borderless row reads as part
     of that surface rather than an inset panel. */
  .err-search-mount .search-meta{
    padding:10px 2px 6px;font-size:.85rem;
    text-transform:none;letter-spacing:normal;font-weight:600;
    color:var(--ink-2);
  }
  .err-search-mount .search-meta:empty{display:none}
  .err-search-mount .search-results{
    border:1px solid var(--line);border-radius:10px;
    max-height:60vh;
  }
  /* Hide the empty results list before the visitor has typed
     anything — otherwise the bordered box renders as a stray
     horizontal rule below the search input. */
  .err-search-mount .search-results:empty{
    display:none;
  }

<!-- Tiny inline i18n for the 404 — translates the visible copy based
     on either the saved netsec-lang preference or the browser
     Accept-Language header. Falls back to English. -->
<script>
(function(){
  var STRINGS = {
    en: {
      title: 'Page not found',
      body: "The page you're looking for may have moved, or the link may be outdated. Use one of the routes below to get back into the site.",
      searchprompt: 'Or search the site for what you were looking for:',
      placeholder: 'Search the site',
      home: 'Back to home',
      sitemap: 'Open the site map',
      langnote: 'Also available in'
    },
    fr: {
      title: 'Page introuvable',
      body: "La page que vous cherchez a peut-être été déplacée, ou le lien est obsolète. Utilisez l'une des options ci-dessous pour revenir sur le site.",
      searchprompt: 'Ou cherchez sur le site ce que vous vouliez trouver :',
      placeholder: 'Rechercher sur le site',
      home: "Retour à l'accueil",
      sitemap: 'Voir le plan du site',
      langnote: 'Disponible aussi en'
    },
    de: {
      title: 'Seite nicht gefunden',
      body: 'Die gesuchte Seite wurde möglicherweise verschoben oder der Link ist veraltet. Nutzen Sie einen der untenstehenden Wege, um zurück auf die Website zu kommen.',
      searchprompt: 'Oder durchsuchen Sie die Website nach dem, was Sie suchen wollten:',
      placeholder: 'Auf der Website suchen',
      home: 'Zurück zur Startseite',
      sitemap: 'Sitemap öffnen',
      langnote: 'Auch verfügbar auf'
    }
  };

  // 1. Saved preference wins; otherwise pick from navigator.languages.
  function pickLang() {
    try {
      var saved = localStorage.getItem('netsec-lang');
      if (saved && STRINGS[saved]) return saved;
    } catch (e) {}
    var langs = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || 'en'];
    for (var i = 0; i < langs.length; i++) {
      var two = (langs[i] || '').toLowerCase().slice(0, 2);
      if (STRINGS[two]) return two;
    }
    return 'en';
  }

  // Apply a locale's strings + link targets + active-language mark.
  // We deliberately run this for English too (rather than early-
  // exiting), so a visitor who switches FR → EN sees the page text
  // change immediately rather than staying frozen on the FR HTML.
  function applyLang(lang) {
    if (!STRINGS[lang]) lang = 'en';
    document.documentElement.lang = lang;
    var t = STRINGS[lang];
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });
    // Localise the action-button targets.
    var home = document.querySelector('a[data-i18n="home"]');
    if (home) home.href = lang === 'en' ? '/' : '/index.' + lang + '.html';
    var sm = document.querySelector('a[data-i18n="sitemap"]');
    if (sm) sm.href = lang === 'en' ? '/sitemap.html' : '/sitemap.' + lang + '.html';
    // Mark the active language in the switcher so it reads as a
    // label rather than a link (CSS handles the visual state).
    document.querySelectorAll('.err-lang a[hreflang]').forEach(function (a) {
      var isCurrent = a.getAttribute('hreflang') === lang;
      if (isCurrent) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  applyLang(pickLang());

  // In-place language switch. Clicking *Français* / *Deutsch* /
  // *English* used to navigate to the localised home (`/`,
  // `/index.fr.html`, `/index.de.html`), which yanked the visitor
  // off the 404 they'd just landed on. New behaviour: save the
  // chosen locale, then reload — GitHub Pages re-serves `404.html`
  // for the same unknown URL, pickLang() returns the saved locale
  // on the next load, and the URL bar stays honest about where
  // the visitor was trying to go. The existing href is preserved
  // as a no-JS fallback (localised home is still better than a
  // broken click).
  document.querySelectorAll('.err-lang a[hreflang]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var newLang = a.getAttribute('hreflang');
      if (!STRINGS[newLang]) return;
      e.preventDefault();
      // Clicking the currently-active language is a no-op — CSS
      // already de-emphasises it, but the link is still focusable
      // so a keyboard user can still hit Enter on it.
      if (document.documentElement.lang === newLang) return;
      try { localStorage.setItem('netsec-lang', newLang); } catch (e) {}
      window.location.reload();
    });
  });
})();
</script>

<!-- Inline mini-search on the 404 page. Calls Pagefind's low-level
     `pagefind.js` module directly and renders results using the
     same .search-result-* / .search-bio-* CSS classes as the
     Cmd-K overlay, so dark mode and bio cards work consistently.
     If /pagefind/ isn't available (local dev, pre-deploy) the
     module import fails and the whole search block hides itself —
     the action buttons + sitemap link below still cover the user
     need. -->
<script>
(function () {
  var input = document.getElementById('err-search-input');
  var clearBtn = document.getElementById('err-search-clear');
  var metaEl = document.getElementById('err-search-meta');
  var listEl = document.getElementById('err-search-results');
  var mount = document.getElementById('search-404');
  var prompt = document.querySelector('.err-search-prompt');
  if (!input || !metaEl || !listEl) return;

  // Locale-aware copy. The 404 already i18n's its visible text via
  // STRINGS up top; we only need search-specific phrases here.
  var lang = (document.documentElement.lang || 'en').toLowerCase().slice(0, 2);
  var SEARCH_STRINGS = {
    en: { placeholder:'Search the site', searching:'Searching…', noresults:'No results for "{q}"', count:'{n} result{s} for {q}', clearLabel:'Clear', unavailable:'Search is currently unavailable.' },
    fr: { placeholder:'Rechercher sur le site', searching:'Recherche…', noresults:'Aucun résultat pour « {q} »', count:'{n} résultat{s} pour {q}', clearLabel:'Effacer', unavailable:'La recherche est actuellement indisponible.' },
    de: { placeholder:'Auf der Website suchen', searching:'Suche läuft…', noresults:'Keine Ergebnisse für „{q}"', count:'{n} Ergebnis{s} für {q}', clearLabel:'Leeren', unavailable:'Die Suche ist derzeit nicht verfügbar.' }
  };
  var t = SEARCH_STRINGS[lang] || SEARCH_STRINGS.en;
  // German plural for 'Ergebnis' is 'Ergebnisse' (-se), English / French both add 's'.
  var pluralS = lang === 'de' ? 'se' : 's';
  input.placeholder = t.placeholder;
  if (clearBtn) clearBtn.setAttribute('aria-label', t.clearLabel);

  // Lazy-load the low-level Pagefind module. We don't memoise on
  // first input the way site.js's overlay does — the 404 lands
  // with focus elsewhere, so the visitor types when they're ready
  // and the import overlaps with the keystroke debounce.
  var pf = null;
  var pfPromise = null;
  function loadPF() {
    if (pfPromise) return pfPromise;
    pfPromise = (async function() {
      try {
        var mod = await import('/pagefind/pagefind.js');
        // Same highlight-param convention as the Cmd-K overlay.
        await mod.options({ highlightParam: 'pagefind-highlight' });
        pf = mod;
        return mod;
      } catch (e) {
        // /pagefind/ not deployed yet (local dev) — hide the whole
        // block so the page doesn't show an orphan input.
        if (mount) mount.style.display = 'none';
        if (prompt) prompt.style.display = 'none';
        throw e;
      }
    })();
    return pfPromise;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // Bio stubs live at /search/bios/<lang>/<slug>.html and carry a
  // meta-refresh that redirects direct visitors to the canonical
  // /people.html#<slug>. Rewrite Pagefind hit URLs here so the
  // result link goes straight to the directory entry without an
  // intermediate stub-page round-trip.
  function canonicalBioUrl(stubUrl) {
    if (!stubUrl) return null;
    var m = stubUrl.match(/\/search\/bios\/([a-z]{2})\/([^/?#.]+)\.html(\?[^#]*)?/);
    if (!m) return null;
    var path = m[1] === 'en' ? '/people.html' : '/people.' + m[1] + '.html';
    return path + (m[3] || '') + '#' + m[2];
  }

  function initialsFor(name) {
    var tokens = String(name).replace(/^(Dr|Prof|Mr|Mrs|Ms|Mx)\.?\s+/i,'').trim().split(/\s+/);
    if (!tokens.length) return '?';
    var first = tokens[0].charAt(0).toUpperCase();
    var last = tokens.length > 1 ? tokens[tokens.length - 1].charAt(0).toUpperCase() : '';
    return escapeHtml(first + last);
  }

  function renderBioHit(hit, i) {
    var rawTitle = (hit.meta.title || '').replace(/\s+—\s+NetSec directory$/, '');
    var name = escapeHtml(rawTitle);
    var affiliation = escapeHtml(hit.meta.affiliation || '');
    var role = escapeHtml(hit.meta.role || '');
    var country = (hit.meta.country || '').toLowerCase().replace(/[^a-z]/g, '');
    var photo = hit.meta.photo || '';
    var wgs = (hit.meta.wgs || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var url = canonicalBioUrl(hit.url) || hit.url;
    var flagImg = country
      ? '<img class="search-bio-flag" src="https://flagcdn.com/h20/' + country + '.png" alt="" loading="lazy">'
      : '';
    var photoEl = photo
      ? '<img class="search-bio-photo" src="' + escapeHtml(photo) + '" alt="" loading="lazy">'
      : '<span class="search-bio-photo search-bio-photo-fallback" aria-hidden="true">' + initialsFor(rawTitle) + '</span>';
    var wgChips = wgs.map(function(w){ return '<span class="search-bio-wg">WG' + escapeHtml(w) + '</span>'; }).join('');
    var subline = role || affiliation;
    return ''
      + '<li role="option" aria-selected="false" id="err-search-result-' + i + '" class="search-bio">'
      +   '<a href="' + url + '">'
      +     photoEl
      +     '<div class="search-bio-text">'
      +       '<div class="search-bio-head">'
      +         '<span class="search-bio-name">' + name + '</span>'
      +         flagImg
      +       '</div>'
      +       (subline ? '<div class="search-bio-subline">' + subline + '</div>' : '')
      +       (role && affiliation && role !== affiliation
                ? '<div class="search-bio-affiliation">' + affiliation + '</div>' : '')
      +       (wgChips ? '<div class="search-bio-wgs">' + wgChips + '</div>' : '')
      +     '</div>'
      +   '</a>'
      + '</li>';
  }

  function renderPageHit(hit, i) {
    var title = escapeHtml(hit.meta.title || hit.url);
    var sub = hit.sub_results && hit.sub_results[0];
    var heading = sub ? escapeHtml(sub.title) : '';
    var url = sub ? sub.url : hit.url;
    // Pagefind's `excerpt` already contains <mark> tags around the
    // matched terms; pass through unescaped. The bio-stub fix
    // means this excerpt is now drawn from the bio body text
    // rather than from concatenated meta paragraphs.
    var excerpt = sub ? sub.excerpt : hit.excerpt;
    return ''
      + '<li role="option" aria-selected="false" id="err-search-result-' + i + '">'
      +   '<a href="' + url + '">'
      +     '<div class="search-result-head">'
      +       '<span class="search-result-title">' + title + '</span>'
      +       (heading ? '<span class="search-result-sep">·</span><span class="search-result-section">' + heading + '</span>' : '')
      +     '</div>'
      +     '<div class="search-result-excerpt">' + excerpt + '</div>'
      +   '</a>'
      + '</li>';
  }

  function renderHit(hit, i) {
    if (hit.meta && hit.meta.kind === 'bio') return renderBioHit(hit, i);
    return renderPageHit(hit, i);
  }

  function fmtCount(n, query) {
    return t.count
      .replace('{n}', String(n))
      .replace('{s}', n === 1 ? '' : pluralS)
      .replace('{q}', '"' + query + '"');
  }

  var lastQuery = '';
  var debounceId = null;

  async function run(query) {
    query = query.trim();
    lastQuery = query;
    if (!query) {
      listEl.innerHTML = '';
      metaEl.textContent = '';
      if (clearBtn) clearBtn.hidden = true;
      return;
    }
    if (clearBtn) clearBtn.hidden = false;
    metaEl.textContent = t.searching;
    try {
      await loadPF();
    } catch (e) {
      metaEl.textContent = t.unavailable;
      listEl.innerHTML = '';
      return;
    }
    if (lastQuery !== query) return;  // stale
    var result;
    try {
      result = await pf.search(query);
    } catch (e) {
      metaEl.textContent = t.unavailable;
      listEl.innerHTML = '';
      return;
    }
    if (lastQuery !== query) return;
    if (!result || !result.results.length) {
      listEl.innerHTML = '';
      metaEl.textContent = t.noresults.replace('{q}', '"' + query + '"');
      return;
    }
    // Top 10 — Pagefind returns ranked results lazily.
    var slice = result.results.slice(0, 10);
    var loaded;
    try {
      loaded = await Promise.all(slice.map(function(r){ return r.data(); }));
    } catch (e) {
      metaEl.textContent = t.unavailable;
      listEl.innerHTML = '';
      return;
    }
    if (lastQuery !== query) return;
    metaEl.textContent = fmtCount(loaded.length, query);
    listEl.innerHTML = loaded.map(renderHit).join('');
  }

  input.addEventListener('input', function() {
    if (debounceId) clearTimeout(debounceId);
    debounceId = setTimeout(function(){ run(input.value); }, 220);
  });
  // Escape clears the field (matches Cmd-K overlay behaviour).
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && input.value) {
      e.preventDefault();
      input.value = '';
      run('');
    }
  });
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      input.value = '';
      input.focus();
      run('');
    });
  }
})();
</script>

</body>
</html>
