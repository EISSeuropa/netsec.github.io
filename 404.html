<!-- Tiny inline i18n for the 404 — translates the visible copy based
     on either the saved netsec-lang preference or the browser
     Accept-Language header. Falls back to English. -->
<script>
(function(){
  var STRINGS = {
    en: {
      title: 'Page not found',
      body: "The page you're looking for may have moved, or the link may be outdated. Use one of the routes below to get back into the site.",
      searchprompt: 'Or search the site for what you were looking for:',
      placeholder: 'Search the site',
      home: 'Back to home',
      sitemap: 'Open the site map',
      langnote: 'Also available in'
    },
    fr: {
      title: 'Page introuvable',
      body: "La page que vous cherchez a peut-être été déplacée, ou le lien est obsolète. Utilisez l'une des options ci-dessous pour revenir sur le site.",
      searchprompt: 'Ou cherchez sur le site ce que vous vouliez trouver :',
      placeholder: 'Rechercher sur le site',
      home: "Retour à l'accueil",
      sitemap: 'Voir le plan du site',
      langnote: 'Disponible aussi en'
    },
    de: {
      title: 'Seite nicht gefunden',
      body: 'Die gesuchte Seite wurde möglicherweise verschoben oder der Link ist veraltet. Nutzen Sie einen der untenstehenden Wege, um zurück auf die Website zu kommen.',
      searchprompt: 'Oder durchsuchen Sie die Website nach dem, was Sie suchen wollten:',
      placeholder: 'Auf der Website suchen',
      home: 'Zurück zur Startseite',
      sitemap: 'Sitemap öffnen',
      langnote: 'Auch verfügbar auf'
    }
  };

  // 1. Saved preference wins; otherwise pick from navigator.languages.
  function pickLang() {
    try {
      var saved = localStorage.getItem('netsec-lang');
      if (saved && STRINGS[saved]) return saved;
    } catch (e) {}
    var langs = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || 'en'];
    for (var i = 0; i < langs.length; i++) {
      var two = (langs[i] || '').toLowerCase().slice(0, 2);
      if (STRINGS[two]) return two;
    }
    return 'en';
  }

  var lang = pickLang();
  if (lang === 'en') return;  // English is the default; nothing to swap.

  document.documentElement.lang = lang;
  var t = STRINGS[lang];
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });

  // Point the home button at the localised index.
  var home = document.querySelector('a[data-i18n="home"]');
  if (home) home.href = lang === 'en' ? '/' : '/index.' + lang + '.html';
  // Sitemap link too.
  var sm = document.querySelector('a[data-i18n="sitemap"]');
  if (sm) sm.href = lang === 'en' ? '/sitemap.html' : '/sitemap.' + lang + '.html';
})();
</script>

<!-- Inline mini-search on the 404 page. Calls Pagefind's low-level
     `pagefind.js` module directly and renders results using the
     same .search-result-* / .search-bio-* CSS classes as the
     Cmd-K overlay, so dark mode and bio cards work consistently.
     If /pagefind/ isn't available (local dev, pre-deploy) the
     module import fails and the whole search block hides itself —
     the action buttons + sitemap link below still cover the user
     need. -->
<script>
(function () {
  var input = document.getElementById('err-search-input');
  var clearBtn = document.getElementById('err-search-clear');
  var metaEl = document.getElementById('err-search-meta');
  var listEl = document.getElementById('err-search-results');
  var mount = document.getElementById('search-404');
  var prompt = document.querySelector('.err-search-prompt');
  if (!input || !metaEl || !listEl) return;

  // Locale-aware copy. The 404 already i18n's its visible text via
  // STRINGS up top; we only need search-specific phrases here.
  var lang = (document.documentElement.lang || 'en').toLowerCase().slice(0, 2);
  var SEARCH_STRINGS = {
    en: { placeholder:'Search the site', searching:'Searching…', noresults:'No results for "{q}"', count:'{n} result{s} for {q}', clearLabel:'Clear', unavailable:'Search is currently unavailable.' },
    fr: { placeholder:'Rechercher sur le site', searching:'Recherche…', noresults:'Aucun résultat pour « {q} »', count:'{n} résultat{s} pour {q}', clearLabel:'Effacer', unavailable:'La recherche est actuellement indisponible.' },
    de: { placeholder:'Auf der Website suchen', searching:'Suche läuft…', noresults:'Keine Ergebnisse für „{q}"', count:'{n} Ergebnis{s} für {q}', clearLabel:'Leeren', unavailable:'Die Suche ist derzeit nicht verfügbar.' }
  };
  var t = SEARCH_STRINGS[lang] || SEARCH_STRINGS.en;
  // German plural for 'Ergebnis' is 'Ergebnisse' (-se), English / French both add 's'.
  var pluralS = lang === 'de' ? 'se' : 's';
  input.placeholder = t.placeholder;
  if (clearBtn) clearBtn.setAttribute('aria-label', t.clearLabel);

  // Lazy-load the low-level Pagefind module. We don't memoise on
  // first input the way site.js's overlay does — the 404 lands
  // with focus elsewhere, so the visitor types when they're ready
  // and the import overlaps with the keystroke debounce.
  var pf = null;
  var pfPromise = null;
  function loadPF() {
    if (pfPromise) return pfPromise;
    pfPromise = (async function() {
      try {
        var mod = await import('/pagefind/pagefind.js');
        // Same highlight-param convention as the Cmd-K overlay.
        await mod.options({ highlightParam: 'pagefind-highlight' });
        pf = mod;
        return mod;
      } catch (e) {
        // /pagefind/ not deployed yet (local dev) — hide the whole
        // block so the page doesn't show an orphan input.
        if (mount) mount.style.display = 'none';
        if (prompt) prompt.style.display = 'none';
        throw e;
      }
    })();
    return pfPromise;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // Bio stubs live at /search/bios/<lang>/<slug>.html and carry a
  // meta-refresh that redirects direct visitors to the canonical
  // /people.html#<slug>. Rewrite Pagefind hit URLs here so the
  // result link goes straight to the directory entry without an
  // intermediate stub-page round-trip.
  function canonicalBioUrl(stubUrl) {
    if (!stubUrl) return null;
    var m = stubUrl.match(/\/search\/bios\/([a-z]{2})\/([^/?#.]+)\.html(\?[^#]*)?/);
    if (!m) return null;
    var path = m[1] === 'en' ? '/people.html' : '/people.' + m[1] + '.html';
    return path + (m[3] || '') + '#' + m[2];
  }

  function initialsFor(name) {
    var tokens = String(name).replace(/^(Dr|Prof|Mr|Mrs|Ms|Mx)\.?\s+/i,'').trim().split(/\s+/);
    if (!tokens.length) return '?';
    var first = tokens[0].charAt(0).toUpperCase();
    var last = tokens.length > 1 ? tokens[tokens.length - 1].charAt(0).toUpperCase() : '';
    return escapeHtml(first + last);
  }

  function renderBioHit(hit, i) {
    var rawTitle = (hit.meta.title || '').replace(/\s+—\s+NetSec directory$/, '');
    var name = escapeHtml(rawTitle);
    var affiliation = escapeHtml(hit.meta.affiliation || '');
    var role = escapeHtml(hit.meta.role || '');
    var country = (hit.meta.country || '').toLowerCase().replace(/[^a-z]/g, '');
    var photo = hit.meta.photo || '';
    var wgs = (hit.meta.wgs || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var url = canonicalBioUrl(hit.url) || hit.url;
    var flagImg = country
      ? '<img class="search-bio-flag" src="https://flagcdn.com/h20/' + country + '.png" alt="" loading="lazy">'
      : '';
    var photoEl = photo
      ? '<img class="search-bio-photo" src="' + escapeHtml(photo) + '" alt="" loading="lazy">'
      : '<span class="search-bio-photo search-bio-photo-fallback" aria-hidden="true">' + initialsFor(rawTitle) + '</span>';
    var wgChips = wgs.map(function(w){ return '<span class="search-bio-wg">WG' + escapeHtml(w) + '</span>'; }).join('');
    var subline = role || affiliation;
    return ''
      + '<li role="option" aria-selected="false" id="err-search-result-' + i + '" class="search-bio">'
      +   '<a href="' + url + '">'
      +     photoEl
      +     '<div class="search-bio-text">'
      +       '<div class="search-bio-head">'
      +         '<span class="search-bio-name">' + name + '</span>'
      +         flagImg
      +       '</div>'
      +       (subline ? '<div class="search-bio-subline">' + subline + '</div>' : '')
      +       (role && affiliation && role !== affiliation
                ? '<div class="search-bio-affiliation">' + affiliation + '</div>' : '')
      +       (wgChips ? '<div class="search-bio-wgs">' + wgChips + '</div>' : '')
      +     '</div>'
      +   '</a>'
      + '</li>';
  }

  function renderPageHit(hit, i) {
    var title = escapeHtml(hit.meta.title || hit.url);
    var sub = hit.sub_results && hit.sub_results[0];
    var heading = sub ? escapeHtml(sub.title) : '';
    var url = sub ? sub.url : hit.url;
    // Pagefind's `excerpt` already contains <mark> tags around the
    // matched terms; pass through unescaped. The bio-stub fix
    // means this excerpt is now drawn from the bio body text
    // rather than from concatenated meta paragraphs.
    var excerpt = sub ? sub.excerpt : hit.excerpt;
    return ''
      + '<li role="option" aria-selected="false" id="err-search-result-' + i + '">'
      +   '<a href="' + url + '">'
      +     '<div class="search-result-head">'
      +       '<span class="search-result-title">' + title + '</span>'
      +       (heading ? '<span class="search-result-sep">·</span><span class="search-result-section">' + heading + '</span>' : '')
      +     '</div>'
      +     '<div class="search-result-excerpt">' + excerpt + '</div>'
      +   '</a>'
      + '</li>';
  }

  function renderHit(hit, i) {
    if (hit.meta && hit.meta.kind === 'bio') return renderBioHit(hit, i);
    return renderPageHit(hit, i);
  }

  function fmtCount(n, query) {
    return t.count
      .replace('{n}', String(n))
      .replace('{s}', n === 1 ? '' : pluralS)
      .replace('{q}', '"' + query + '"');
  }

  var lastQuery = '';
  var debounceId = null;

  async function run(query) {
    query = query.trim();
    lastQuery = query;
    if (!query) {
      listEl.innerHTML = '';
      metaEl.textContent = '';
      if (clearBtn) clearBtn.hidden = true;
      return;
    }
    if (clearBtn) clearBtn.hidden = false;
    metaEl.textContent = t.searching;
    try {
      await loadPF();
    } catch (e) {
      metaEl.textContent = t.unavailable;
      listEl.innerHTML = '';
      return;
    }
    if (lastQuery !== query) return;  // stale
    var result;
    try {
      result = await pf.search(query);
    } catch (e) {
      metaEl.textContent = t.unavailable;
      listEl.innerHTML = '';
      return;
    }
    if (lastQuery !== query) return;
    if (!result || !result.results.length) {
      listEl.innerHTML = '';
      metaEl.textContent = t.noresults.replace('{q}', '"' + query + '"');
      return;
    }
    // Top 10 — Pagefind returns ranked results lazily.
    var slice = result.results.slice(0, 10);
    var loaded;
    try {
      loaded = await Promise.all(slice.map(function(r){ return r.data(); }));
    } catch (e) {
      metaEl.textContent = t.unavailable;
      listEl.innerHTML = '';
      return;
    }
    if (lastQuery !== query) return;
    metaEl.textContent = fmtCount(loaded.length, query);
    listEl.innerHTML = loaded.map(renderHit).join('');
  }

  input.addEventListener('input', function() {
    if (debounceId) clearTimeout(debounceId);
    debounceId = setTimeout(function(){ run(input.value); }, 220);
  });
  // Escape clears the field (matches Cmd-K overlay behaviour).
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && input.value) {
      e.preventDefault();
      input.value = '';
      run('');
    }
  });
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      input.value = '';
      input.focus();
      run('');
    });
  }
})();
</script>
