name: 📰 News item
description: A news item for the website (EN, FR, DE), the RSS feed, the LinkedIn and Bluesky posts and the newsletter.
title: "news: "
body:
  - type: markdown
    attributes:
      value: |
        Fill in this form to announce something on netsec-cost.eu, LinkedIn and Bluesky. Write in English: French and German translations are added for you.

        After you submit it, a robot turns the form into a draft. Nothing is public until the maintainer approves that draft. If something goes wrong, the robot leaves a comment on this issue saying what to change.

        Headline and Summary are required. Leave any other field blank if it does not apply. Write plain text everywhere: no links, no bold, no hashtags copied from LinkedIn. The web address goes in the Link field.

        You can leave the issue title as it is.
  - type: dropdown
    id: site
    attributes:
      label: Site
      description: >-
        Who the news is from. Pick "NetSec" for NetSec news, or "Joint (EISS and
        NetSec)" for something NetSec organises with EISS. For news from EISS
        alone, do not use this form: ask the maintainer.
      options:
        - NetSec
        - Joint (EISS and NetSec)
        - EISS
      default: 0
    validations:
      required: true
  - type: input
    id: headline
    attributes:
      label: Headline
      description: >-
        The title of the item, up to 100 characters. It opens the LinkedIn and
        Bluesky posts. Example: "ESSC 2027: the call for papers is open".
      placeholder: "ESSC 2027: the call for papers is open"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >-
        One or two sentences, up to 300 characters including spaces. It appears
        on the home page. A longer summary stops the robot, which then asks you
        to shorten it. If you leave Body blank, the summary is also the full
        text of the item and of the posts.
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Body
      description: >-
        Optional. The full text of the item. It appears in the news archive and
        the RSS feed, and it is the text of the LinkedIn and Bluesky posts.
        Plain text only.
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: >-
        The label shown next to the item on the website. "event" is for a
        conference, workshop or meeting, "publication" for a paper or report,
        "call" for an open call with a deadline, and "announcement" for
        anything else.
      options:
        - announcement
        - event
        - publication
        - call
      default: 0
    validations:
      required: false
  - type: dropdown
    id: wg
    attributes:
      label: Working Group
      description: >-
        If the item comes from one NetSec Working Group, pick it. The item is
        then tagged with that group. Otherwise keep "No Working Group".
      options:
        - No Working Group
        - WG1
        - WG2
        - WG3
        - WG4
      default: 0
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: Link
      description: >-
        Optional. The web address of a page that already exists, such as the
        event page. The item on the website gets a "Read more" link to it, and
        the LinkedIn and Bluesky posts end with it. Copy the full address from
        your browser, starting with https://. Leave it blank if there is no
        page: the posts then link to the news on the home page.
    validations:
      required: false
  - type: input
    id: date
    attributes:
      label: Publication date
      description: >-
        Optional. The date shown on the item, written year-month-day with
        dashes, for example 2026-12-01. Leave it blank to use today's date.
      placeholder: "2026-12-01"
    validations:
      required: false
  - type: input
    id: until
    attributes:
      label: On the home page until
      description: >-
        Optional. The last day the item shows on the home page, written
        year-month-day with dashes, for example 2027-01-26. After that day it
        stays in the news archive only. For a call, use the closing date. Leave
        it blank to keep the item on the home page until newer items replace
        it.
    validations:
      required: false
  - type: dropdown
    id: collaborator
    attributes:
      label: Collaborator page
      description: >-
        Pick "EISS" if EISS's LinkedIn page should be added to the LinkedIn post
        as a collaborator. The maintainer adds it by hand after the post goes
        out. Otherwise keep "No collaborator".
      options:
        - No collaborator
        - EISS
      default: 0
    validations:
      required: false
  - type: checkboxes
    id: options
    attributes:
      label: Options
      description: >-
        Tick "Include in the newsletter" to also put the item in the next
        monthly newsletter. Tick "Do not post to LinkedIn and Bluesky" for an
        item that should appear on the website only.
      options:
        - label: Include in the newsletter
          required: false
        - label: Do not post to LinkedIn and Bluesky
          required: false
