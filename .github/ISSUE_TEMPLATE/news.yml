name: 📰 News item
description: A news item for the website (EN, FR, DE), the RSS feed and the LinkedIn and Bluesky posts.
title: "news: "
body:
  - type: markdown
    attributes:
      value: |
        Fill in this form to announce something on netsec-cost.eu, LinkedIn and Bluesky. Write in English: French and German translations are added for you.

        After you submit it, a robot turns the form into a draft. Nothing is public until the maintainer approves that draft. If something goes wrong, the robot leaves a comment on this issue saying what to change.

        Headline, Website summary and Post on are required. Leave any other field blank if it does not apply. The website, LinkedIn and Bluesky each get their own text: write the website summary and the body plainly, and the posts the way you would write them on each network. The web address goes in the Link field, and a photo in the Image field.

        Every box has a length limit, given in its description. GitHub does not count the characters as you type, so the robot checks them after you submit and tells you which box to shorten.

        The "Add a title" box at the top only names this request on GitHub. You can leave it as "news:": the robot renames the issue after your headline. The Headline field below is the title readers see.
  - type: dropdown
    id: site
    attributes:
      label: Site
      description: >-
        Who the news is from. Pick "NetSec" for NetSec news, or "Joint (EISS and
        NetSec)" for something NetSec organises with EISS. A joint item that
        goes to LinkedIn needs EISS as Collaborator page, below. News from EISS
        alone goes in the EISS repository's form.
      options:
        - NetSec
        - Joint (EISS and NetSec)
      default: 0
    validations:
      required: true
  - type: input
    id: headline
    attributes:
      label: Headline
      description: >-
        The title of the item, up to 100 characters. It opens the LinkedIn and
        Bluesky posts. Example: "ESSC 2027: the call for papers is open".
      placeholder: "ESSC 2027: the call for papers is open"
    validations:
      required: true
  - type: textarea
    id: website-summary
    attributes:
      label: Website summary
      description: >-
        One or two plain sentences for the home page, up to 300 characters
        including spaces. No emojis, tags or links: the web address goes in
        the Link field. If you leave Body empty, the summary is also the full
        text of the item.
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Body
      description: >-
        Optional. The full text of the item, up to 2,000 characters, in plain
        text. It appears in the news archive and the RSS feed, and in a
        LinkedIn or Bluesky post whose box below is left empty.
    validations:
      required: false
  - type: checkboxes
    id: networks
    attributes:
      label: Post on
      description: >-
        Tick where the news is posted. Tick at least one, unless the item is
        for the website only (Options, at the end): with none ticked, the
        robot stops and asks you to tick one. The box of a network left
        unticked is ignored.
      options:
        - label: LinkedIn
        - label: Bluesky
  - type: textarea
    id: linkedin-post
    attributes:
      label: LinkedIn post
      description: >-
        Optional. The post exactly as it should appear on LinkedIn, in English,
        up to 3,000 characters. Line breaks, emojis and hashtags are kept. Only
        the first two or three lines show before "see more", so start with the
        news. To tag a page, write @NetSec, @EISS or @COST. A post copied from
        LinkedIn can be pasted as it is: a link to one of those pages becomes
        its tag, and any other link its plain name. The Link is added at the
        end unless the post already holds it. Leave it empty to post the
        headline, the body and the link.
      render: text
    validations:
      required: false
  - type: textarea
    id: bluesky-post
    attributes:
      label: Bluesky post
      description: >-
        Optional. The post exactly as it should appear on Bluesky, in English,
        up to 300 characters, and the link counts. The Link is added at the end
        unless the post already holds it, and a tag is written out as the
        account's Bluesky name (@EISS becomes @eissnetwork.bsky.social), so
        leave room for both. Tags are written @NetSec, @EISS or @COST. Leave it
        empty to post the headline, the body and the link, shortened to fit.
      render: text
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: >-
        The label shown next to the item on the website. "event" is for a
        conference, workshop or meeting, "publication" for a paper or report,
        "call" for an open call with a deadline, and "announcement" for
        anything else.
      options:
        - announcement
        - event
        - publication
        - call
      default: 0
    validations:
      required: false
  - type: dropdown
    id: wg
    attributes:
      label: Working Group
      description: >-
        If the item comes from one NetSec Working Group, pick it. The item is
        then tagged with that group. Otherwise keep "No Working Group".
      options:
        - No Working Group
        - WG1
        - WG2
        - WG3
        - WG4
      default: 0
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: Link
      description: >-
        Optional. The web address of a page that already exists, such as the
        event page. The item on the website gets a "Read more" link to it, and
        the LinkedIn and Bluesky posts end with it. Copy the full address from
        your browser, starting with https://. Anything else stops the robot.
        Leave it blank if there is no page: the posts then link to the news on
        the home page.
    validations:
      required: false
  - type: textarea
    id: image
    attributes:
      label: Image
      description: >-
        Optional. A photo for the LinkedIn and Bluesky posts. Drag the photo
        from your computer into this box, or tap the box and paste it on a
        phone, then wait until a line starting with "<img" or "![" appears.
        Use a JPEG or PNG. A large photo is made smaller for you. Use only a
        photo NetSec may publish, and ask the people who can be recognised in
        it first. Leave the box empty to use the event's card, when Link points
        to an event page, or the standard NetSec picture. The website does not
        show the photo.
    validations:
      required: false
  - type: input
    id: image-description
    attributes:
      label: Image description
      description: >-
        Needed when you add a photo. One sentence in English saying what the
        photo shows, up to 300 characters. Screen readers read it aloud to
        people who cannot see the photo. Example: "Four speakers seated at a
        panel table in front of a projected slide."
    validations:
      required: false
  - type: input
    id: date
    attributes:
      label: Publication date
      description: >-
        Optional. The date shown on the item, written year-month-day with
        dashes, for example 2026-12-01. Another format stops the robot. Leave
        it blank to use today's date.
      placeholder: "2026-12-01"
    validations:
      required: false
  - type: input
    id: until
    attributes:
      label: On the home page until
      description: >-
        Optional. The last day the item shows on the home page, written
        year-month-day with dashes, for example 2027-01-26. After that day it
        stays in the news archive only. For a call, use the closing date.
        Another format stops the robot. Leave it blank to keep the item on the
        home page until newer items replace it.
    validations:
      required: false
  - type: dropdown
    id: collaborator
    attributes:
      label: Collaborator page
      description: >-
        Pick "EISS" if EISS's LinkedIn page should be added to the LinkedIn post
        as a collaborator. Required when the Site is Joint and LinkedIn is
        ticked. The maintainer adds it by hand after the post goes out.
        Otherwise keep "No collaborator".
      options:
        - No collaborator
        - EISS
      default: 0
    validations:
      required: false
  - type: checkboxes
    id: options
    attributes:
      label: Options
      description: >-
        Tick the box for an item that should appear on the website only, for
        example one already announced on LinkedIn and Bluesky. Leave Post on
        unticked then.
      options:
        - label: Do not post to LinkedIn and Bluesky
          required: false
