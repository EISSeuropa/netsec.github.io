# Satisfy the required CodeQL status checks on Dependabot PRs.
#
# Why this exists
#   CodeQL "default setup" does not analyse Dependabot pull requests. Instead of
#   the per-language `Analyze (...)` runs it posts on human-authored PRs, a
#   Dependabot PR gets a single neutral `CodeQL` run and none of the
#   `Analyze (actions)` / `Analyze (javascript-typescript)` / `Analyze (python)`
#   status contexts. The `protect-main` ruleset requires those three, so a
#   Dependabot PR sits BLOCKED forever on checks that never arrive (e.g. an
#   actions-only bump like #1222).
#
#   Dependabot bumps are low-risk and CodeQL was never analysing them anyway, so
#   this posts the three required contexts (plus the umbrella `CodeQL`) as
#   success for Dependabot PRs only. Human-authored PRs are untouched: the job
#   is gated on the Dependabot actor, so real CodeQL gating still applies to
#   everyone else.
#
# Why pull_request_target
#   The token on a Dependabot `pull_request` run is read-only, so it cannot
#   write commit statuses. `pull_request_target` runs from the base branch with
#   a writable token. No PR code is checked out here (the job only posts
#   statuses), so the usual pull_request_target code-execution risk does not
#   apply.
name: CodeQL shim for Dependabot

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  statuses: write

jobs:
  shim:
    name: Satisfy CodeQL contexts for Dependabot
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Post success for the CodeQL status contexts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for ctx in "CodeQL" "Analyze (actions)" "Analyze (javascript-typescript)" "Analyze (python)"; do
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=success \
              -f context="$ctx" \
              -f description="Dependabot PR: CodeQL default setup does not analyse these; satisfied by codeql-dependabot-shim." \
              --silent
          done
