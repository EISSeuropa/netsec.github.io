# SEO + asset cache-bust check.
#
# Runs scripts/inject-seo.py --check on every PR. The script exits
# non-zero if anything is out of date:
#
#   - a managed page's SEO / JSON-LD block has drifted from what the
#     generator would produce, or
#   - a stylesheet/script reference is missing its current
#     ?v=<content-hash> cache-bust token (issue #416).
#
# That keeps a CSS or JS change from merging without the cache-bust
# hashes being refreshed in the same PR, so returning visitors never
# render new markup against a stale cached stylesheet. Re-stamp locally
# with:
#
#     python3 scripts/inject-seo.py
#
# This is a REQUIRED status check (ruleset protect-main). It used to be
# path-filtered to HTML/CSS/JS, but a path-filtered required check never
# reports on PRs outside those paths, so a docs-only or data-only PR
# stays blocked forever waiting for a status that never arrives. It now
# runs on every PR; --check is a fast read-only pass (no third-party
# services, no API keys), so on an unrelated PR it simply confirms
# everything is current and passes. See issue #483.
name: SEO + asset cache-bust check

on:
  pull_request:
  workflow_dispatch:       # Allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  seo-assets:
    name: Check SEO + asset version drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Run the SEO block checker
        # --seo-only since #1712: the ?v= tokens are no longer committed, so
        # there is nothing here to be stale. They are stamped in
        # pages-deploy.yml and asserted there before the tree is published.
        run: python3 scripts/inject-seo.py --check --seo-only

      - name: Install Pillow for the photograph check
        run: python3 -m pip install --quiet 'Pillow>=12.3.0,<13'

      - name: Editorial photographs have a current .webp (#1615)
        # The gallery on /essc-2026.html served four 1400px JPEGs into a grid
        # that renders each at most 327x240, which was the last page over the
        # image budget. This fails if a photograph has been added or replaced
        # without its derivative, which is the same posture as the cache-bust
        # check above: a generated asset that must be current in the same PR.
        run: python3 scripts/build-photo-derivatives.py --check
