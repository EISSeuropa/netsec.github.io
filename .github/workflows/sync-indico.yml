# Daily sync of data/indico.json from the EISS Indico instance.
#
# Why direct commit, not auto-PR
# ------------------------------
# Same justification as EISS's sync-indico.yml: this sync is fully
# read-only against public Indico data. The information is already
# visible on indico.eiss-europa.com; surfacing the same titles +
# dates + speaker names on the NetSec static site doesn't introduce
# new privacy or accuracy risk. So this workflow commits directly to
# main when indico.json changes substantively (the script's idempotency
# guard suppresses no-op writes — see scripts/sync-indico.py).
#
# Failure handling
# ----------------
# If Indico is unreachable, sync-indico.py exits 1 and this workflow
# fails. The existing indico.json snapshot in the repo is NOT touched
# — the site keeps working with the last good data. The only signal
# is a red badge on the Actions tab. Same posture as sync-bios.yml.

name: Sync events from Indico

on:
  schedule:
    # 03:45 UTC daily. EISS runs at the same time (we share the Indico
    # instance but the two workflows don't coordinate — each one
    # makes its own ~2 HTTP calls so the instance load is trivial).
    - cron: "45 3 * * *"
  workflow_dispatch:      # Manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: indico-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh indico.json from the EISS Indico export API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync-indico.py
        env:
          # Opt-in Bearer auth for the (future) /api/* call sites.
          # Stored as a repo-level Actions secret; provisioned by the
          # maintainer on the shared service account that the EISS
          # sync also uses. Anonymous /export/* calls work without
          # this — set it for forward compatibility.
          INDICO_API_TOKEN: ${{ secrets.INDICO_API_TOKEN }}
        run: python3 scripts/sync-indico.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain data/indico.json)" ]]; then
            echo "No substantive change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indico.json
          git commit -m "data: refresh indico.json from sync-indico.py

          Auto-generated by .github/workflows/sync-indico.yml.
          Source: https://indico.eiss-europa.com/export/categ/1.json"
          git push
