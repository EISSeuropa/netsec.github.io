# Refresh data/roadmap-progress.json from the repo's GitHub milestones.
#
# What this does
#   - Reads every milestone (open + closed) via the GitHub API and
#     writes the per-version closed/total/percent into
#     data/roadmap-progress.json.
#   - Opens a PR on `roadmap-progress/auto` (auto-merge armed) if the
#     milestone *data* moved. If nothing changed, it is a no-op (the
#     generator leaves the file untouched, so create-pull-request finds
#     no diff and opens nothing).
#
# Why a committed JSON instead of a live API call from the page
#   The public roadmap (/roadmap.html) renders the bars from this file
#   so the page stays fully static, dodges the unauthenticated API rate
#   limit, and keeps working if the API is briefly unreachable. Same
#   render-from-JSON contract as the cost.eu / Indico syncs.
#
# When it runs
#   - On issue close / reopen / (de)milestone and on milestone edits,
#     so a closed issue updates the bar within a minute.
#   - Daily at 06:30 UTC as a belt-and-braces backstop.
#   - On manual dispatch.

name: Sync roadmap milestone progress

on:
  issues:
    types: [closed, reopened, milestoned, demilestoned, deleted]
  milestone:
    types: [closed, opened, edited, deleted]
  schedule:
    - cron: '30 6 * * *'   # Daily 06:30 UTC, after the Monday roadmap autostamp
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: roadmap-progress
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh data/roadmap-progress.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Regenerate progress JSON
        env:
          # The script calls `gh api`; gh authenticates from GH_TOKEN.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/sync-roadmap-progress.py | tee /tmp/roadmap-progress.txt
          {
            echo "Auto-generated refresh of \`data/roadmap-progress.json\` from the"
            echo "repo's GitHub milestones. The public roadmap renders an in-flight"
            echo "progress bar per milestone from this file."
            echo ""
            echo '```'
            cat /tmp/roadmap-progress.txt
            echo '```'
            echo ""
            echo "_Workflow: **Sync roadmap milestone progress**, run_id \`${{ github.run_id }}\`, trigger \`${{ github.event_name }}\`._"
          } > /tmp/roadmap-progress-pr-body.md

      - name: Open or update PR if progress changed
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7 (sha-pinned)
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: roadmap-progress/auto
          base: main
          delete-branch: true
          title: 'data: refresh roadmap milestone progress'
          commit-message: |
            data: refresh roadmap milestone progress

            Auto-generated by scripts/sync-roadmap-progress.py from the
            repo's GitHub milestones. See the PR body for the delta.
          body-path: /tmp/roadmap-progress-pr-body.md
          labels: |
            automated
            data-sync

      - name: Arm auto-merge on the auto-PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge \
            "${{ steps.create-pr.outputs.pull-request-number }}" \
            --squash --auto \
            --repo "${{ github.repository }}"
