# Translation drift check.
#
# Runs scripts/check-i18n-drift.py on every PR. If the script exits
# non-zero (any registered translation's English source has changed
# since the translation was stamped), this check fails and the PR
# can't be merged until either the translations are refreshed or the
# manifest is explicitly bumped via:
#
#     python3 scripts/check-i18n-drift.py --mark-fresh <source> <lang>
#
# That keeps drift from slipping in unnoticed when someone edits an
# English page without remembering its FR/DE siblings.
#
# Zero cost: no third-party services, no API keys.
#
# A required status check on main since #1904, reported as
# `i18n-drift / check`. It has no paths filter, because a required check
# that never reports leaves a PR pending forever, and the job takes about
# 9 seconds. The job id is unique so the context names this workflow
# alone. calendar-drift.yml and news-drift.yml follow the same pattern
# since #1911.
name: i18n drift check

on:
  pull_request:
  workflow_dispatch:       # Allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  i18n-drift:
    uses: ./.github/workflows/_pycheck.yml
    with:
      command: python3 scripts/check-i18n-drift.py
