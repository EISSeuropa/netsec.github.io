# Reusable workflow: check out the repo, set up Python 3.12, run one check
# command. Called by the single-command, no-dependency check workflows
# (i18n / calendar / news drift, CSS class collisions, external-link arrows,
# SEO asset drift, brand lint). Centralises the SHA-pinned checkout +
# setup-python so a Dependabot bump touches one file instead of seven
# (CLAUDE.md §12: the pins live here now).
name: Python check (reusable)

on:
  workflow_call:
    inputs:
      command:
        description: The check command to run (must exit non-zero on failure).
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Run check
        run: ${{ inputs.command }}
