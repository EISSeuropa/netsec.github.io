# Broken-link check.
#
# Runs scripts/check-links.sh on:
#   - every PR that touches an HTML file at the repo root (catches a
#     bad link before merge)
#   - weekly on main (catches external link rot — the EU Commission
#     and COST sometimes shuffle their public URLs, and we want to
#     hear about it within a week rather than weeks later when a
#     visitor reports it)
#   - manual dispatch from the Actions tab
#
# The script is a portable Python-only check that exits non-zero on
# any broken link. See the script header for the host-skip list
# (auth-gated URLs are skipped, not failed).
#
# This workflow's first run was at the launch-QA pass in May 2026
# (see docs/launch-qa-2026.md).
name: Link check

on:
  pull_request:
    paths:
      - '*.html'
      - 'scripts/check-links.sh'
      - '.github/workflows/launch-qa-link-check.yml'
  schedule:
    # Weekly on Mondays at 06:00 UTC — picks up external link rot
    # without waking anyone at a bad hour.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Resolve every internal + external link
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Run link check
        run: ./scripts/check-links.sh --quiet

      - name: Check the accessibility statement's review date
        # Fails when the "next scheduled review" date in the statement's
        # version footer has passed, warns inside the 60-day window.
        # Piggybacks on this weekly run so an overdue review surfaces
        # as a red Monday run rather than going unnoticed.
        run: python3 scripts/check-a11y-statement-date.py
