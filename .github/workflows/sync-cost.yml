# Weekly sync of the WG_MAP in index.html from cost.eu/actions/CA24154/.
#
# What this does
#   1. Every Monday at 05:00 UTC (~07:00 Central Europe), and on
#      manual dispatch from the Actions tab, fetch the COST Action
#      page and re-parse the Membership table.
#   2. If the embedded WG_MAP changed (members added / removed /
#      changed WGs), rebuild the /people/<slug> profile pages from
#      the synced data (a member's reconciled WGs and leadership feed
#      their profile page), then open or update a pull request on the
#      branch `cost-sync/auto` with the human-readable diff in the body.
#   3. If nothing changed, the action exits without opening a PR —
#      no inbox noise.
#
# Where to look
#   - The sync logic lives in scripts/sync-cost.py and is repo-local;
#     this workflow just invokes it inside CI.
#   - Open PRs from this workflow are labelled `automated` + `data-sync`
#     so they're easy to filter.

name: Sync WG membership from cost.eu

on:
  schedule:
    - cron: '0 5 * * 1'   # Every Monday 05:00 UTC
  workflow_dispatch:      # Manual run from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  # If a manual run starts while the weekly run is in flight, cancel
  # the older one so we don't get duplicate PRs.
  group: cost-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh WG_MAP from cost.eu
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'
          # `cache: pip` needs a dependency manifest to hash for the
          # cache key. Point it at scripts/requirements.txt.
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync script and capture diff
        id: sync
        run: |
          set -o pipefail
          python3 scripts/sync-cost.py | tee /tmp/sync-output.txt
          # Run the i18n drift checker after the sync, but never fail
          # the workflow on its exit code — its job here is to *report*
          # which translations need refreshing, not to gate the auto-PR.
          # The output gets appended to the PR body so the merging
          # admin sees the drift at a glance.
          python3 scripts/check-i18n-drift.py > /tmp/drift-output.txt 2>&1 || true
          # Build a Markdown body for the PR. peter-evans/create-pull-request
          # will only actually open a PR if `git diff` shows changes, so this
          # body is only ever surfaced when there's something to report.
          # Every report section prints "(no changes)" when it is quiet, so a
          # sync that moved one member reads as four no-op blocks and is easy
          # to skim past (#1411). Lift the actual change bullets (the report's
          # "  + " / "  - " lines) to the top as the verdict. The "  · " lines
          # are discrepancies under watch, not changes, so they stay below.
          grep -E '^  [+-] ' /tmp/sync-output.txt > /tmp/sync-changes.txt || true
          {
            echo "Auto-detected changes in the Membership table at"
            echo "<https://www.cost.eu/actions/CA24154/>."
            echo ""
            echo "**$(wc -l < /tmp/sync-changes.txt | tr -d ' ') change(s) in this sync:**"
            echo ""
            echo '```'
            cat /tmp/sync-changes.txt
            echo '```'
            echo ""
            echo "<details><summary>Full sync report</summary>"
            echo ""
            echo '```'
            cat /tmp/sync-output.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "### Translation drift after this sync"
            echo ""
            echo '```'
            cat /tmp/drift-output.txt
            echo '```'
            echo ""
            echo "If any translations are now ⚠️ stale, refresh them by hand"
            echo "(see \`docs/i18n.md\`) and then \`--mark-fresh\` before merging,"
            echo "or merge this PR as-is and refresh in a follow-up — the"
            echo "non-blocking ribbon on the FR/DE pages already warns visitors"
            echo "that the English version is authoritative."
            echo ""
            echo "_Generated by the **Sync WG membership from cost.eu** workflow._"
            echo "_Triggered: \`${{ github.event_name }}\` · run_id: \`${{ github.run_id }}\`_"
          } > /tmp/pr-body.md

      - name: Regenerate per-member OG cards from the synced data (#1023)
        run: |
          # sync-cost.py can change a member's reconciled `wgs` and
          # `wg_leadership`, which feed the per-member OG card hash
          # (build-og-cards.py renders the WG / lead pills onto the card).
          # Render any card whose inputs changed (manifest-keyed, so
          # churn-free) BEFORE the profile-page rebuild, so the same auto-PR
          # carries the refreshed card and the data-shape / pytest
          # `build-og-cards.py --check` gates pass. Without this, a WG or
          # leadership move leaves the card stale and the sync PR fails CI
          # (the bios sync already runs this; the cost sync was missing it).
          # Chrome is preinstalled on the runner.
          python3 scripts/build-og-cards.py

      - name: Rebuild member profile pages from the synced data
        run: |
          # sync-cost.py writes a member's reconciled `wgs`, `wg_leadership`
          # and leadership `roles` into data/bios.json, which the
          # /people/<slug> profile pages (#762) render their WG chips and
          # role line from. Regenerate so a WG move or leadership change
          # reaches the profile page in the same auto-PR; otherwise the
          # "Profile pages are current (#762)" gate in data-shape-check.yml
          # fails on every sync that touches a member with a profile page
          # (#989). Idempotent: unchanged pages produce no diff. inject-seo
          # is not needed here, the sync touches no ?v= asset hashes.
          python3 scripts/build-profile-pages.py

      - name: Rebuild the Pagefind bio search stubs (#1428)
        run: |
          # search/bios/<lang>/<slug>.html carry the `wgs` facet site search
          # filters on, and sync-cost.py writes `wgs` into data/bios.json. This
          # was the one generator the cost sync did not run, so a WG membership
          # arriving from cost.eu left the member missing from a WG-filtered
          # search until the next daily bios sync happened to rebuild the stubs
          # (four days, in #1411 -> #1421). Same gap as #1218 on the bios side.
          # Idempotent; regenerated from bios.json.
          python3 scripts/build-bio-search-stubs.py

      - name: Regenerate the NetSec Atlas graph from the synced WG rosters (#764)
        run: |
          # data/atlas.json is derived from data/wg.json. sync-cost.py rewrites
          # wg.json, so regenerate the graph in the same auto-PR; otherwise the
          # "atlas.json is current (#764)" gate in data-shape-check.yml fails on
          # every sync that adds, removes, or re-slugs a WG member. Pure standard
          # library, idempotent: an unchanged roster produces no diff.
          python3 scripts/build-atlas.py

      - name: Prepend a one-line summary of what actually changed
        run: |
          # Same reasoning as the matching step in sync-bios.yml: /tmp/pr-body.md
          # was composed straight after sync-cost.py, before the OG-card,
          # profile-page, and atlas rebuilds above, so its run log describes the
          # cost.eu fetch and not the derived files in the diff. Read the working
          # tree now that the generators have run and lead the body with a
          # one-line verdict. Prints nothing on a clean tree.
          python3 scripts/summarise-sync-changes.py > /tmp/sync-summary.md
          if [ -s /tmp/sync-summary.md ]; then
            { cat /tmp/sync-summary.md; echo ""; cat /tmp/pr-body.md; } \
              > /tmp/pr-body.new && mv /tmp/pr-body.new /tmp/pr-body.md
          fi

      - name: Open or update PR if WG_MAP changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7 (sha-pinned)
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: cost-sync/auto
          base: main
          delete-branch: true
          title: 'data: sync WG memberships + leadership from cost.eu'
          commit-message: |
            data: sync WG memberships + leadership from cost.eu

            Refreshed four surfaces against the Membership and
            Leadership tables on cost.eu/actions/CA24154/:
              - WG_MAP literal in index.html (home-page WG chips)
              - per-bio `wgs` + `wg_leadership` in data/bios.json (directory)
              - leadership `roles` array on seed entries in data/bios.json
              - data/wg.json (per-WG membership + leadership)
              - /people/<slug> profile pages rebuilt from the above
            See the PR body for the exact diffs.
          body-path: /tmp/pr-body.md
          labels: |
            automated
            data-sync
          # Assign the maintainer as reviewer so GitHub emails +
          # mobile push the auto-PR opening. The PR auto-merges
          # via the next step regardless; the reviewer line is
          # purely for the change-awareness signal.
          reviewers: APB-LDN
