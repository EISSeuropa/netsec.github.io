# Data-shape + render smoke gate for synced data PRs.
#
# The sync workflows (Indico daily, bios + COST weekly, roadmap-progress
# on issue events) open auto-merged PRs that rewrite files under data/.
# The pages consuming those files render at runtime in the browser, so
# a malformed upstream shape change would ship a blank page with every
# other check green. This workflow closes that gap in two steps:
#
#   1. scripts/check-data-shape.py — structural invariants per synced
#      file (the "would this blank a page?" set).
#   2. scripts/check-render-smoke.sh — headless Chrome renders
#      /essc-2026.html, /people.html and /index.html off a local
#      server and asserts the runtime renderers produced cards.
#
# When this fails: the shape lint prints the exact violated invariant
# and file; the smoke step prints which page rendered zero cards. For
# an upstream contract change that is legitimate, update the consuming
# renderer and the validator in the same PR as the data refresh.
#
# Zero cost: no third-party services, no API keys. Chrome ships on the
# ubuntu runners.
name: data shape + render smoke

on:
  pull_request:
    paths:
      - 'data/indico.json'
      - 'data/bios.json'
      - 'data/wg.json'
      - 'data/mc-members.json'
      - 'data/events.json'
      - 'data/roadmap-progress.json'
      - 'data/orcid-works.json'
      - 'scripts/check-data-shape.py'
      - 'scripts/check-render-smoke.sh'
      - 'scripts/build-profile-pages.py'
      - 'data/prize-winners.json'
      - 'people.html'
      - 'people.fr.html'
      - 'people.de.html'
      - 'people/**'
      - 'scripts/build-sitemap.py'
      - 'sitemap.xml'
      - 'scripts/build-og-cards.py'
      - 'assets/og/people/**'
      - 'scripts/build-directory-index.py'
      - 'directory-index.json'
      - 'scripts/build-network-map.py'
      - 'data/network-map.json'
      # build-network-map.py also owns the list region of these three
      # pages, so a hand edit to one has to face the same drift gate.
      - 'network-map.html'
      - 'network-map.fr.html'
      - 'network-map.de.html'
      - 'data/essc-*-programme.json'
      - 'scripts/check-indico-semantics.py'
      - 'data/publications.json'
      - '.github/workflows/data-shape-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Validate data shape and smoke-render consuming pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Validate synced data shapes
        run: python3 scripts/check-data-shape.py

      - name: Smoke-render the consuming pages
        run: bash scripts/check-render-smoke.sh

      - name: Profile pages are current (#762)
        # The /people/<slug> profile pages are generated from bios.json +
        # the people.* shells. Fail if the committed pages have drifted, so
        # a hand edit or a forgotten regeneration can't reach the site.
        run: python3 scripts/build-profile-pages.py --check

      - name: Sitemap is current (#1027)
        # sitemap.xml is generated from the top-level page table plus the
        # members in data/bios.json (#1716). Fail if a new member profile is
        # missing from the sitemap or the committed file has drifted.
        run: python3 scripts/build-sitemap.py --check

      - name: directory-index.json is current
        # The cross-site member contract (EISSeuropa/EISSeuropa.github.io#966)
        # is generated from bios.json. Fail if a member change has not been
        # reflected in the committed index, so a consuming site never matches
        # against stale data.
        run: python3 scripts/build-directory-index.py --check

      - name: Indico data means what it says (#1718)
        # check-data-shape.py validates shape: types, required fields,
        # referential integrity. It passes a conference held in Stockholm
        # carrying a Paris timezone, because that value is well-formed. Indico
        # is an upstream nobody here controls, so a field that is well-formed
        # and wrong is exactly the failure a shape check cannot see, and the
        # daily auto-PR is where it should stop.
        #
        # A finding that is real, upstream and already tracked is listed in
        # KNOWN_UPSTREAM in the script: it still prints, it does not fail, and
        # an allowance that stops matching is reported as stale so it cannot
        # rot into a check that verifies nothing.
        run: python3 scripts/check-indico-semantics.py

      - name: network-map.json and the map's list region are current (#764)
        # The NetSec Network Map graph is derived from wg.json by build-network-map.py,
        # which also renders the list region of the three locale pages. Fail if wg.json
        # changed without regenerating either, so the sync (sync-cost.py) can never
        # leave the graph stale, and the list under the map can never disagree with it.
        run: python3 scripts/build-network-map.py --check

      - name: Bio search stubs are current (#1428)
        # search/bios/<lang>/<slug>.html are what Pagefind indexes, and they
        # carry the country and `wgs` facets site search filters on. Both the
        # bios sync and the cost.eu sync write fields the stubs render, so this
        # gate is what stops either one leaving a member unsearchable or
        # missing from a WG filter. Without it the drift is silent until
        # someone notices the member absent from a search result.
        run: python3 scripts/build-bio-search-stubs.py --check

      - name: OG cards are current (#1023)
        # Per-member OG card PNGs are generated from bios.json. This check is
        # content-keyed (a manifest of each card's inputs), not a pixel diff,
        # so a member whose name/affiliation/country changed without the card
        # being regenerated fails the gate. Needs no browser.
        run: python3 scripts/build-og-cards.py --check
