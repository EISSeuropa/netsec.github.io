# Lock issues closed 14+ days ago with no activity since, so a closed
# thread takes no new comments. The issue stays readable and can still
# be reopened. Locks silently: a bot comment on each notified the
# maintainer as if the issue had been closed again (7 at once on
# 29 September 2026).
name: Lock closed issues

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: lock-closed-issues

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lock issues closed 14+ days ago with no recent activity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v7 (sha-pinned)
        with:
          script: |
            const THRESHOLD_DAYS = 14;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - THRESHOLD_DAYS);

            let page = 1;
            let locked = 0;
            while (true) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                sort: 'updated',
                direction: 'asc',
                per_page: 100,
                page,
              });
              if (issues.length === 0) break;

              for (const issue of issues) {
                if (issue.locked) continue;
                if (issue.pull_request) continue;       // PRs handled separately
                if (new Date(issue.updated_at) > cutoff) continue;

                await github.rest.issues.lock({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  lock_reason: 'resolved',
                });
                locked++;
                console.log(`locked #${issue.number}: ${issue.title}`);
              }

              if (issues.length < 100) break;
              page++;
            }
            console.log(`Done. Locked ${locked} issue(s).`);
