# Weekly rotation of the home-page member spotlight (issue #341).
#
# What this does
#   1. Every Tuesday at 10:00 Central European time (after Monday's bios
#      sync so it sees any new eligible members), and on manual dispatch,
#      run scripts/rotate-spotlight.py. Cron can't follow DST, so two UTC
#      triggers (08:00 + 09:00) fire and a gate job lets exactly one
#      through, the one that lands at 10:00 Europe/Paris.
#   2. The script picks the member to feature this ISO week using a
#      balanced-rotation score (early-career, ITC, Working-Group
#      balance) and writes data/spotlight.json.
#   3. If the state changed, open or update a PR on `spotlight/auto`
#      with the rotation log in the body, armed to auto-merge. If
#      nothing changed (dormant below the eligibility threshold, or
#      already rotated this week), exit silently.
#
# Where to look
#   - Logic + weights + the eligibility threshold: scripts/rotate-spotlight.py.
#   - State: data/spotlight.json (do not hand-edit current/history;
#     set `pinned` to a member id for a manual override).
#   - Renderer: assets/js/home-spotlight.js.

name: Rotate member spotlight

on:
  schedule:
    # Tuesday 10:00 Europe/Paris year-round. 08:00 UTC == 10:00 CEST (summer),
    # 09:00 UTC == 10:00 CET (winter); the gate job below lets through the one
    # matching the current DST offset, so the spotlight posts once every Tuesday.
    - cron: '0 8 * * 2'
    - cron: '0 9 * * 2'
  workflow_dispatch:       # Manual run from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: write          # the alert step below opens/refreshes a tracking issue

concurrency:
  group: spotlight-rotate
  cancel-in-progress: true

jobs:
  # DST gate: both scheduled triggers fire, but only the one whose UTC hour is
  # 10:00 Europe/Paris under the current DST offset proceeds. A manual dispatch
  # always proceeds. Gating on which cron fired (github.event.schedule) rather
  # than the observed local hour makes this immune to GitHub's scheduled-run
  # delays, which routinely push a run tens of minutes (sometimes hours) past
  # its cron minute and used to fail an exact hour==10 check (#1298).
  gate:
    name: Proceed only at 10:00 Europe/Paris
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ='Europe/Paris' date +%z)   # +0200 in summer (CEST), +0100 in winter (CET)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif { [ "$offset" = "+0200" ] && [[ "$SCHEDULE" == "0 8 "* ]]; } \
            || { [ "$offset" = "+0100" ] && [[ "$SCHEDULE" == "0 9 "* ]]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cron '${SCHEDULE}' is not the 10:00 Europe/Paris trigger for offset ${offset}; skipped."
          fi

  rotate:
    name: Rotate the weekly member spotlight
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The `social-auto` environment carries the Bluesky credentials WITHOUT a
    # required reviewer, so the weekly spotlight posts itself. News and curated
    # threads stay on the gated `social` environment (social-bluesky.yml); only
    # this low-risk, auto-generated post is ungated.
    environment: social-auto
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Rotate the spotlight and capture the log
        env:
          SPOTLIGHT_PR_TITLE_PATH: /tmp/spotlight-pr-title.txt
          SPOTLIGHT_PR_OVERVIEW_PATH: /tmp/spotlight-pr-overview.md
        run: |
          set -o pipefail
          # Pure standard library; no dependency install needed.
          python3 scripts/rotate-spotlight.py | tee /tmp/spotlight.txt
          {
            if [ -s /tmp/spotlight-pr-overview.md ]; then
              cat /tmp/spotlight-pr-overview.md
              echo ""
            fi
            echo "## Run log"
            echo ""
            echo '```'
            cat /tmp/spotlight.txt
            echo '```'
            echo ""
            echo "---"
            echo "_Gender is not scored; correct any imbalance by setting \`pinned\` in \`data/spotlight.json\`._"
            echo "_Workflow: **Rotate member spotlight**, run_id \`${{ github.run_id }}\`, trigger \`${{ github.event_name }}\`._"
          } > /tmp/spotlight-pr-body.md

      - name: Post the spotlight to Bluesky + LinkedIn (ungated, idempotent)
        # Posts the current week's spotlight. Idempotent: the dedup key carries
        # the ISO week, so a re-run (or a no-rotation week) posts nothing. Kept
        # non-blocking so a social hiccup never holds up the home-page rotation;
        # if it fails, the ledger stays unchanged and the next run retries.
        # --best-effort means a LinkedIn failure (e.g. an expired token) doesn't
        # stop the Bluesky post, and `continue-on-error` keeps a total failure
        # off the job's red X.
        #
        # Exit 2 is social-post.py's "best-effort swallowed a channel failure"
        # code. We record it as an output rather than failing the step, so the
        # rotation still lands and the final step can raise a visible alarm.
        # The LinkedIn access token expired in August 2026 and the only trace
        # was a ::warning:: on a green run, so the miss was noticed by hand.
        id: social
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          # LinkedIn org page (ungated). Same secrets as the gated environment;
          # unset ones resolve to empty and LinkedIn is skipped.
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: |
          if [ -z "$BSKY_HANDLE" ] || [ -z "$BSKY_APP_PASSWORD" ]; then
            echo "::warning::Bluesky secrets not set on the social-auto environment; skipping the spotlight post."
            exit 0
          fi
          python3 scripts/social-post.py --live --channel all --best-effort --kind spotlight 2>&1 | tee /tmp/social.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 2 ]; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            # The failure lines social-post.py prints, for the alert body.
            grep -E '^[[:space:]]+! ' /tmp/social.txt | head -n 5 > /tmp/social-failures.txt || true
          fi
          exit 0

      - name: Compose PR title
        id: pr-title
        run: |
          if [ -s /tmp/spotlight-pr-title.txt ]; then
            title=$(head -n 1 /tmp/spotlight-pr-title.txt)
          else
            title='data: rotate weekly member spotlight'
          fi
          title=${title:0:240}
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Open or update PR if the spotlight changed
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7 (sha-pinned)
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: spotlight/auto
          base: main
          delete-branch: true
          add-paths: |
            data/spotlight.json
            data/social-posted.json
          title: ${{ steps.pr-title.outputs.title }}
          commit-message: |
            ${{ steps.pr-title.outputs.title }}

            Auto-generated by the spotlight rotation workflow.
            See the PR body for the rotation log.
          body-path: /tmp/spotlight-pr-body.md
          labels: |
            automated
            data-sync
          # Reviewer line is purely the change-awareness signal; the PR
          # auto-merges via the next step regardless.
          reviewers: APB-LDN

      - name: Arm auto-merge on the auto-PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge \
            "${{ steps.create-pr.outputs.pull-request-number }}" \
            --squash --auto \
            --repo "${{ github.repository }}"

      # Silent degradation is the failure mode that actually bites here: the
      # post step is best-effort and continue-on-error, so a dead LinkedIn
      # token leaves a green run and an absent post. Mirrors the alert shape
      # in autopr-token-health.yml: one open issue, refreshed by comment on
      # each recurrence, rather than a new issue every Tuesday. Runs last so
      # a failure here cannot hold up the rotation PR above.
      - name: Alert when a channel failed to publish
        if: steps.social.outputs.degraded == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          {
            echo "The weekly spotlight rotation published to some channels but not all. The rotation itself is unaffected: the home page updated normally and the ledger did not record the failed channel, so the next run retries it."
            echo ""
            echo '```'
            if [ -s /tmp/social-failures.txt ]; then
              cat /tmp/social-failures.txt
            else
              echo "(no failure line captured; read the run log)"
            fi
            echo '```'
            echo ""
            echo "Run: ${RUN_URL}"
            echo ""
            echo "Most likely cause is an expired LinkedIn access token, which lasts about 60 days. It renews itself only when LINKEDIN_CLIENT_ID and LINKEDIN_CLIENT_SECRET are set on the social-auto environment alongside the refresh token. Setup and the refresh command are in docs/social-publishing.md, section B.4."
          } > /tmp/social-alert.md
          title="Weekly spotlight did not reach every social channel"
          existing=$(gh issue list --search "${title} in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/social-alert.md
          else
            gh issue create --title "$title" --body-file /tmp/social-alert.md --label bug
          fi
