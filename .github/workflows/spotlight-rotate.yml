# Weekly rotation of the home-page member spotlight (issue #341).
#
# What this does
#   1. Every Tuesday at 10:00 Central European time (after Monday's bios
#      sync so it sees any new eligible members), and on manual dispatch,
#      run scripts/rotate-spotlight.py. Cron can't follow DST, so two UTC
#      triggers (08:00 + 09:00) fire and a gate job lets exactly one
#      through, the one that lands at 10:00 Europe/Paris.
#   2. The script picks the member to feature this ISO week using a
#      balanced-rotation score (early-career, ITC, Working-Group
#      balance) and writes data/spotlight.json.
#   3. If the state changed, open or update a PR on `spotlight/auto`
#      with the rotation log in the body, armed to auto-merge. If
#      nothing changed (dormant below the eligibility threshold, or
#      already rotated this week), exit silently.
#
# Where to look
#   - Logic + weights + the eligibility threshold: scripts/rotate-spotlight.py.
#   - State: data/spotlight.json (do not hand-edit current/history;
#     set `pinned` to a member id for a manual override).
#   - Renderer: assets/js/home-spotlight.js.

name: Rotate member spotlight

on:
  schedule:
    # Tuesday 10:00 Europe/Paris year-round. 08:00 UTC == 10:00 CEST (summer),
    # 09:00 UTC == 10:00 CET (winter); the gate job below drops whichever one
    # is not 10:00 local, so the spotlight posts once, at 10:00, every Tuesday.
    - cron: '0 8 * * 2'
    - cron: '0 9 * * 2'
  workflow_dispatch:       # Manual run from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spotlight-rotate
  cancel-in-progress: true

jobs:
  # DST gate: both scheduled triggers fire, but only the one at 10:00
  # Europe/Paris proceeds. A manual dispatch always proceeds.
  gate:
    name: Proceed only at 10:00 Europe/Paris
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ='Europe/Paris' date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "10" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Currently ${hour}:00 Europe/Paris, not 10:00; this trigger is skipped."
          fi

  rotate:
    name: Rotate the weekly member spotlight
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The `social-auto` environment carries the Bluesky credentials WITHOUT a
    # required reviewer, so the weekly spotlight posts itself. News and curated
    # threads stay on the gated `social` environment (social-bluesky.yml); only
    # this low-risk, auto-generated post is ungated.
    environment: social-auto
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Rotate the spotlight and capture the log
        env:
          SPOTLIGHT_PR_TITLE_PATH: /tmp/spotlight-pr-title.txt
          SPOTLIGHT_PR_OVERVIEW_PATH: /tmp/spotlight-pr-overview.md
        run: |
          set -o pipefail
          # Pure standard library; no dependency install needed.
          python3 scripts/rotate-spotlight.py | tee /tmp/spotlight.txt
          {
            if [ -s /tmp/spotlight-pr-overview.md ]; then
              cat /tmp/spotlight-pr-overview.md
              echo ""
            fi
            echo "## Run log"
            echo ""
            echo '```'
            cat /tmp/spotlight.txt
            echo '```'
            echo ""
            echo "---"
            echo "_Gender is not scored; correct any imbalance by setting \`pinned\` in \`data/spotlight.json\`._"
            echo "_Workflow: **Rotate member spotlight**, run_id \`${{ github.run_id }}\`, trigger \`${{ github.event_name }}\`._"
          } > /tmp/spotlight-pr-body.md

      - name: Post the spotlight to Bluesky (ungated, idempotent)
        # Posts the current week's spotlight. Idempotent: the dedup key carries
        # the ISO week, so a re-run (or a no-rotation week) posts nothing. Kept
        # non-blocking so a Bluesky hiccup never holds up the home-page rotation;
        # if it fails, the ledger stays unchanged and the next run retries.
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ -z "$BSKY_HANDLE" ] || [ -z "$BSKY_APP_PASSWORD" ]; then
            echo "::warning::Bluesky secrets not set on the social-auto environment; skipping the spotlight post."
            exit 0
          fi
          python3 scripts/social-post.py --live --channel bluesky --kind spotlight

      - name: Compose PR title
        id: pr-title
        run: |
          if [ -s /tmp/spotlight-pr-title.txt ]; then
            title=$(head -n 1 /tmp/spotlight-pr-title.txt)
          else
            title='data: rotate weekly member spotlight'
          fi
          title=${title:0:240}
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Open or update PR if the spotlight changed
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7 (sha-pinned)
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: spotlight/auto
          base: main
          delete-branch: true
          add-paths: |
            data/spotlight.json
            data/social-posted.json
          title: ${{ steps.pr-title.outputs.title }}
          commit-message: |
            ${{ steps.pr-title.outputs.title }}

            Auto-generated by the spotlight rotation workflow.
            See the PR body for the rotation log.
          body-path: /tmp/spotlight-pr-body.md
          labels: |
            automated
            data-sync
          # Reviewer line is purely the change-awareness signal; the PR
          # auto-merges via the next step regardless.
          reviewers: APB-LDN

      - name: Arm auto-merge on the auto-PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge \
            "${{ steps.create-pr.outputs.pull-request-number }}" \
            --squash --auto \
            --repo "${{ github.repository }}"
