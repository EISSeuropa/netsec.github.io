# Publish NetSec news to Bluesky, approval-gated.
# Phase 2 of the social pipeline (#1072).
#
# Flow:
#   1. `preview` runs the composer in --dry-run, writes the exact posts to the
#      run summary, and counts how many would actually post. No secrets.
#   2. `publish` runs only when that count is non-zero, and targets the `social`
#      environment, so GitHub PAUSES it for a required reviewer. The reviewer
#      reads the preview, approves, and only then does the post go to Bluesky.
#      The dedup ledger update rides back in an auto-merging PR.
#
# Both jobs first union in the keys on the `social/ledger` branch, because that
# PR can still be open when the next run composes. Without it a second news.xml
# push in that window re-queues an already-published item, and the reviewer is
# offered a duplicate post to approve (run 30129049311, 24 July 2026).
#
# Scope: NEWS and curated THREADS (higher-stakes, human-reviewed). The weekly
# member SPOTLIGHT is auto-posted ungated by spotlight-rotate.yml (low-risk,
# auto-generated), so it is deliberately NOT triggered here on a spotlight.json
# change. A manual `--kind spotlight`/`all` run still works as an override.
#
# Triggers: a news.xml change on main (a news item landed), or a manual run.
# The manual run can also post a curated multi-post thread
# (data/social-threads/<slug>.json) by passing the `thread` slug input; the same
# preview + approval gate applies.
#
# Secrets (Environment secrets on `social`): BSKY_HANDLE, BSKY_APP_PASSWORD.
# Setup: docs/social-publishing.md.

name: Publish to Bluesky (approval-gated)

on:
  push:
    branches: [main]
    paths:
      - 'news.xml'
  workflow_dispatch:
    inputs:
      kind:
        description: What to post (ignored when a thread slug is given)
        type: choice
        options: [all, news, spotlight]
        default: all
      thread:
        description: 'Curated thread slug under data/social-threads/ (e.g. best-paper-prize-2026); leave empty for news/spotlight'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: social-bluesky
  cancel-in-progress: false

jobs:
  preview:
    name: Preview the pending posts
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.compose.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'
      - name: Fold in a ledger that has not reached main yet
        run: |
          # The previous run's ledger PR (branch social/ledger) can still be
          # open when this run composes, so main's ledger is missing the keys
          # of posts that already went out and this run re-queues them for
          # approval. Union the branch's keys in rather than replacing the
          # file, because social/ledger outlives its merged PR and is often
          # behind main; a union only ever adds "already posted" and so can
          # never resurrect an item main had already ruled out.
          git fetch --depth=1 origin social/ledger 2>/dev/null || exit 0
          git show FETCH_HEAD:data/social-posted.json > branch-ledger.json || exit 0
          python3 - <<'PY'
          import json, pathlib
          led = pathlib.Path("data/social-posted.json")
          cur = json.loads(led.read_text(encoding="utf-8"))
          extra = [k for k in json.loads(pathlib.Path("branch-ledger.json").read_text(encoding="utf-8")).get("posted", [])
                   if k not in cur["posted"]]
          if extra:
              cur["posted"] += extra
              led.write_text(json.dumps(cur, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"::notice::Folded {len(extra)} key(s) in from the unmerged social/ledger branch.")
          PY
          rm -f branch-ledger.json
      - name: Compose (dry-run) into the run summary
        id: compose
        env:
          # A news.xml push posts NEWS only; the weekly spotlight is ungated
          # (spotlight-rotate.yml) and must not be swept into this approval gate.
          # A manual run still honours its `kind` input (default `all`).
          KIND: ${{ github.event.inputs.kind || (github.event_name == 'push' && 'news' || 'all') }}
          THREAD: ${{ github.event.inputs.thread || '' }}
        run: |
          if [ -n "$THREAD" ]; then
            ARGS=(--thread "data/social-threads/${THREAD}.json")
          else
            ARGS=(--kind "$KIND")
          fi
          {
            echo "### Bluesky — pending posts (preview)"
            echo ""
            echo '```'
            python3 scripts/social-post.py --dry-run "${ARGS[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          N=$(python3 scripts/social-post.py --count "${ARGS[@]}")
          echo "count=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" = "0" ]; then
            echo "::notice::Nothing pending — the publish job is skipped, no approval needed."
          else
            echo "::notice::$N post(s) pending — the publish job is waiting for your approval."
          fi

  publish:
    name: Approve, then post to Bluesky
    needs: preview
    if: needs.preview.outputs.count != '0'   # no waiting approval when nothing is pending
    runs-on: ubuntu-latest
    environment: social          # required-reviewer gate; holds the job until approved
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Fold in a ledger that has not reached main yet
        run: |
          # The previous run's ledger PR (branch social/ledger) can still be
          # open when this run composes, so main's ledger is missing the keys
          # of posts that already went out and this run re-queues them for
          # approval. Union the branch's keys in rather than replacing the
          # file, because social/ledger outlives its merged PR and is often
          # behind main; a union only ever adds "already posted" and so can
          # never resurrect an item main had already ruled out.
          git fetch --depth=1 origin social/ledger 2>/dev/null || exit 0
          git show FETCH_HEAD:data/social-posted.json > branch-ledger.json || exit 0
          python3 - <<'PY'
          import json, pathlib
          led = pathlib.Path("data/social-posted.json")
          cur = json.loads(led.read_text(encoding="utf-8"))
          extra = [k for k in json.loads(pathlib.Path("branch-ledger.json").read_text(encoding="utf-8")).get("posted", [])
                   if k not in cur["posted"]]
          if extra:
              cur["posted"] += extra
              led.write_text(json.dumps(cur, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"::notice::Folded {len(extra)} key(s) in from the unmerged social/ledger branch.")
          PY
          rm -f branch-ledger.json

      - name: Post to Bluesky + LinkedIn and update the ledger
        env:
          # A news.xml push posts NEWS only; the weekly spotlight is ungated
          # (spotlight-rotate.yml) and must not be swept into this approval gate.
          # A manual run still honours its `kind` input (default `all`).
          KIND: ${{ github.event.inputs.kind || (github.event_name == 'push' && 'news' || 'all') }}
          THREAD: ${{ github.event.inputs.thread || '' }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          # LinkedIn (org page). ORG_ID + ACCESS_TOKEN are required to post;
          # REFRESH_TOKEN + CLIENT_ID + CLIENT_SECRET let the adapter renew an
          # expired access token. An unset secret resolves to empty and the
          # LinkedIn channel is simply skipped (configured() is false), so this
          # stays a no-op for LinkedIn until the secrets are in place.
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: |
          if [ -n "$THREAD" ]; then
            python3 scripts/social-post.py --live --thread "data/social-threads/${THREAD}.json"
          else
            python3 scripts/social-post.py --live --channel all --kind "$KIND"
          fi

      - name: Persist the dedup ledger via an auto-merging PR
        id: create-pr
        if: ${{ hashFiles('data/social-posted.json') != '' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7 (sha-pinned)
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: social/ledger
          base: main
          delete-branch: true
          add-paths: data/social-posted.json
          title: 'chore(social): record published Bluesky posts'
          commit-message: |
            chore(social): record published Bluesky posts

            Updates the dedup ledger after an approved Bluesky post (#1072).
          body: |
            Records the dedup keys of the items just posted to Bluesky, so they
            are not posted again. Auto-generated by the social-bluesky workflow.
          labels: automated

      - name: Arm auto-merge on the ledger PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" \
            --squash --auto --repo "${{ github.repository }}"
