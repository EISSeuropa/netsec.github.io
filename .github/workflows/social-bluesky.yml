# Publish NetSec news + the weekly member spotlight to Bluesky, approval-gated.
# Phase 2 of the social pipeline (#1072).
#
# Flow:
#   1. `preview` runs the composer in --dry-run and writes the exact posts
#      (text + image) to the run summary. No secrets, no posting.
#   2. `publish` targets the `social` environment, so GitHub PAUSES it for a
#      required reviewer. The reviewer reads the preview, approves, and only
#      then does the post go to Bluesky. The dedup ledger update rides back in
#      an auto-merging PR.
#
# Triggers: a news.xml or data/spotlight.json change on main (i.e. a news item
# or the weekly spotlight rotation landed), or a manual run for testing.
#
# Secrets (Environment secrets on `social`): BSKY_HANDLE, BSKY_APP_PASSWORD.
# Setup: docs/social-publishing.md.

name: Publish to Bluesky (approval-gated)

on:
  push:
    branches: [main]
    paths:
      - 'news.xml'
      - 'data/spotlight.json'
  workflow_dispatch:
    inputs:
      kind:
        description: What to post
        type: choice
        options: [all, news, spotlight]
        default: all

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: social-bluesky
  cancel-in-progress: false

jobs:
  preview:
    name: Preview the pending posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v4 (sha-pinned)
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5 (sha-pinned)
        with:
          python-version: '3.12'
      - name: Compose (dry-run) into the run summary
        env:
          KIND: ${{ github.event.inputs.kind || 'all' }}
        run: |
          {
            echo "### Bluesky — pending posts (preview)"
            echo ""
            echo '```'
            python3 scripts/social-post.py --dry-run --kind "$KIND"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Approve, then post to Bluesky
    needs: preview
    runs-on: ubuntu-latest
    environment: social          # required-reviewer gate; holds the job until approved
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v4 (sha-pinned)
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Post to Bluesky and update the ledger
        env:
          KIND: ${{ github.event.inputs.kind || 'all' }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python3 scripts/social-post.py --live --channel bluesky --kind "$KIND"

      - name: Persist the dedup ledger via an auto-merging PR
        id: create-pr
        if: ${{ hashFiles('data/social-posted.json') != '' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7 (sha-pinned)
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: social/ledger
          base: main
          delete-branch: true
          add-paths: data/social-posted.json
          title: 'chore(social): record published Bluesky posts'
          commit-message: |
            chore(social): record published Bluesky posts

            Updates the dedup ledger after an approved Bluesky post (#1072).
          body: |
            Records the dedup keys of the items just posted to Bluesky, so they
            are not posted again. Auto-generated by the social-bluesky workflow.
          labels: automated

      - name: Arm auto-merge on the ledger PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" \
            --squash --auto --repo "${{ github.repository }}"
