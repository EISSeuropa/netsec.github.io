# Deploy to GitHub Pages.
#
# This workflow replaces the "legacy" Pages source (deploy from the
# main branch directly) with an Actions-based build → deploy pipeline.
# The single reason for the move is the search index: Pagefind's
# content-hashed shard filenames change on every rebuild, so two PRs
# that each rebuilt /pagefind/ inevitably conflicted on the manifest
# (pagefind/pagefind-entry.json). By building the index here at deploy
# time rather than committing it, the conflict source is gone for good.
#
# Inputs / outputs:
#   - reads:  the working tree on main (HTML, assets, scripts)
#   - builds: ./pagefind/ via scripts/build-search.sh (which calls
#             `npx pagefind@1.5.2`; no manual install step needed), and the
#             84 per-member Open Graph cards under assets/og/people/
#   - deploys: the entire working tree (with freshly-built ./pagefind/)
#             to the github-pages environment, custom domain
#             netsec-cost.eu preserved via the repo-root CNAME file.
#
# One-time enablement step (the only thing a maintainer has to do
# manually, once, after this workflow lands):
#   Settings → Pages → Source: change from "Deploy from a branch"
#   to "GitHub Actions". Until that flip happens, Pages keeps building
#   from main on its old schedule and this workflow's deploy step
#   would fail with a "Pages site is not enabled for Actions" error;
#   that's expected during the transition.
#
# Concurrency: at most one in-flight deploy, and a newer run cancels
# the one holding the slot. This reverses the original rule, which let
# a queued deploy wait rather than truncate an in-flight one. In August
# 2026 a deploy job sat in `queued` for six days without ever being
# handed a runner, so it never timed out, held the slot the whole time,
# and every later run was cancelled while pending behind it. The live
# site froze four commits behind main with nothing to signal it.
# Truncating a deploy is the cheaper failure: the next push or the
# six-hourly heartbeat below republishes the same content, which bounds
# staleness at six hours instead of leaving it open-ended.
#
# GOTCHA — cascading workflow suppression on auto-merge:
# GitHub Actions intentionally suppresses downstream workflow runs
# when the same GITHUB_TOKEN that triggered the upstream merge would
# also trigger them. When a PR auto-merges via `gh pr merge --auto`,
# the resulting push to main is signed by `github-actions[bot]` (the
# same token), and this deploy workflow does not fire. The runs
# appear in the Actions tab as "This workflow run has been marked as
# disruptive" with no further detail. Sister project EISSeuropa.github.io
# hit this in May 2026 (see commit b6f0873c on master).
#
# Symptoms: main and the live site diverge, PRs land but the deploy
# never runs, scheduled syncs that ran via `gh pr merge --auto`
# leave the live site behind main.
#
# Self-heal: the `schedule:` trigger below runs the deploy every six
# hours, so a suppressed deploy converges on its own within the interval
# with no manual action (#515). For an immediate publish, either fire
# the `workflow_dispatch` trigger (Actions tab, or `gh workflow run
# pages-deploy.yml`) or push any commit to main from a human-
# authenticated token (your PAT, not GITHUB_TOKEN), e.g. an empty commit
# `git commit --allow-empty -m "ops: wake deploy" && git push`.
#
# The same pattern can suppress PR checks (i18n-drift, css-class-
# collisions, external-link-arrows, launch-qa-link-check) on the PR
# branch when those PR branches were created via bot identity. Wake
# them the same way: push from your human token. CodeQL is managed by
# the GitHub-default scan and follows the same suppression heuristic.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Heartbeat self-heal (#515). Auto-merged PRs (the weekly bios / cost /
  # roadmap syncs, and any `gh pr merge --auto`) push to main signed by
  # github-actions[bot], which suppresses the push trigger above, leaving
  # the live site behind main until someone nudges it. This scheduled run
  # converges the site to main within the interval with no manual action.
  # Idempotent: a no-op deploy just rebuilds the same content. The
  # maintainer can still fire workflow_dispatch for an immediate publish.
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site (incl. Pagefind index)
    runs-on: ubuntu-latest
    # Ceiling, not a target. A healthy build finishes in about three
    # minutes, so anything approaching this is a hung Pagefind crawl
    # rather than a slow one, and the run should die instead of sitting
    # on the `pages` concurrency slot.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4 (sha-pinned)
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Render the per-member Open Graph cards
        # Same reasoning as the Pagefind index and the ?v= tokens: an artefact
        # nobody hand-edits does not belong in the tree (#1716). 84 PNGs were
        # rewritten by the weekly bios and COST syncs, each regeneration a new
        # blob kept forever, and each needed a --check gate to prove it current.
        #
        # About 70 seconds for all 84, because Chrome launches once and the
        # cards are screenshotted in sequence against a local server. There is
        # no manifest in the tree now, so every deploy renders the full set
        # rather than the changed ones.
        #
        # No --ensure-flags here: a bundled flag is an input, it is fetched and
        # committed by the weekly bios sync, and a member whose flag is missing
        # renders a card without one rather than failing.
        run: python3 scripts/build-og-cards.py
        env:
          CHROME: /usr/bin/google-chrome

      - name: Assert every member got a card
        # The cards are the profile pages' og:image, and build-profile-pages.py
        # now names that URL unconditionally rather than testing the file
        # (#1716). So a silent under-render would leave 252 pages pointing at
        # PNGs that 404 on the crawler, with nothing else to catch it.
        run: |
          set -euo pipefail
          want=$(python3 -c "import json; d=json.load(open('data/bios.json')); print(len([m for m in d['members'] if m.get('id')]))")
          got=$(find assets/og/people -name '*.png' | wc -l)
          echo "members: $want, cards: $got"
          [ "$want" -eq "$got" ] || {
            echo "::error::rendered $got cards for $want members; refusing to publish"
            exit 1
          }

      - name: Build Pagefind index (and bio search stubs)
        # scripts/build-search.sh handles both: regenerates the bio
        # stubs from data/bios.json, then runs pagefind against the
        # repo root. Output lands in ./pagefind/ which is gitignored
        # — it ships to Pages via the artifact upload below.
        run: bash scripts/build-search.sh

      - name: Stamp the ?v= cache-bust on every page
        # The same reasoning as the Pagefind index above, applied to the asset
        # tokens (#1712). Committing them meant every front-end pull request
        # rewrote 315 files it had not touched: 97% of the diff, and a rule in
        # CLAUDE.md §2 forbidding two such branches at once. The repository now
        # stores `src="assets/css/site.css"` and the token is applied here,
        # over the top-level pages and the 252 under people/.
        run: python3 scripts/inject-seo.py --stamp-only

      - name: Assert the stamping actually happened
        # The failure mode moved from noisy-but-visible to quiet-and-wrong. If
        # the step above ever silently no-ops, returning visitors render new
        # markup against a cached stylesheet, which is the exact thing the
        # tokens exist to prevent. So the build refuses to publish an unstamped
        # tree rather than shipping one.
        run: |
          set -euo pipefail
          missing=0
          for page in index.html people.html network-map.html people/arthur-laudrain.html; do
            if ! grep -qE 'assets/css/site\.css\?v=[0-9a-f]{8}' "$page"; then
              echo "::error file=$page::no ?v= token after the stamping step"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo '::error::refusing to publish an unstamped tree; see scripts/inject-seo.py --stamp-only'
            exit 1
          }
          echo "cache-bust tokens present on the sampled pages"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v5 (sha-pinned)

      - name: Upload Pages artifact
        # path: . uploads the whole working tree, which now includes
        # the freshly-built ./pagefind/. The CNAME file at the root
        # tells Pages the custom domain.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v3 (sha-pinned)
        with:
          path: .

  deploy:
    name: Deploy to github-pages
    needs: build
    runs-on: ubuntu-latest
    # See the build job's ceiling above. Note the limitation: the clock
    # starts when a runner picks the job up, so it covers a deploy that
    # hangs mid-flight but not one that never starts. The August 2026
    # stall was the latter, which is why `cancel-in-progress` at the top
    # of this file carries the rest of the load.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v4 (sha-pinned)
