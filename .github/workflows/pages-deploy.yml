# Deploy to GitHub Pages.
#
# This workflow replaces the "legacy" Pages source (deploy from the
# main branch directly) with an Actions-based build → deploy pipeline.
# The single reason for the move is the search index: Pagefind's
# content-hashed shard filenames change on every rebuild, so two PRs
# that each rebuilt /pagefind/ inevitably conflicted on the manifest
# (pagefind/pagefind-entry.json). By building the index here at deploy
# time rather than committing it, the conflict source is gone for good.
#
# Inputs / outputs:
#   - reads:  the working tree on main (HTML, assets, scripts)
#   - builds: ./pagefind/ via scripts/build-search.sh (which calls
#             `npx pagefind@1.5.2`; no manual install step needed)
#   - deploys: the entire working tree (with freshly-built ./pagefind/)
#             to the github-pages environment, custom domain
#             netsec-cost.eu preserved via the repo-root CNAME file.
#
# One-time enablement step (the only thing a maintainer has to do
# manually, once, after this workflow lands):
#   Settings → Pages → Source: change from "Deploy from a branch"
#   to "GitHub Actions". Until that flip happens, Pages keeps building
#   from main on its old schedule and this workflow's deploy step
#   would fail with a "Pages site is not enabled for Actions" error;
#   that's expected during the transition.
#
# Concurrency: at most one in-flight deploy per branch; queued
# deploys do not cancel an in-progress one (we'd rather finish a
# deploy than truncate it half-way).
#
# GOTCHA — cascading workflow suppression on auto-merge:
# GitHub Actions intentionally suppresses downstream workflow runs
# when the same GITHUB_TOKEN that triggered the upstream merge would
# also trigger them. When a PR auto-merges via `gh pr merge --auto`,
# the resulting push to main is signed by `github-actions[bot]` (the
# same token), and this deploy workflow does not fire. The runs
# appear in the Actions tab as "This workflow run has been marked as
# disruptive" with no further detail. Sister project EISSeuropa.github.io
# hit this in May 2026 (see commit b6f0873c on master).
#
# Symptoms: main and the live site diverge, PRs land but the deploy
# never runs, scheduled syncs that ran via `gh pr merge --auto`
# leave the live site behind main.
#
# Fix: push any commit to main from a human-authenticated token
# (your personal access token, not GITHUB_TOKEN). An empty commit
# works:
#     git commit --allow-empty -m "ops: wake deploy workflow"
#     git push origin main
# A comment-only edit on any file in the repo leaves a more useful
# audit trail than an empty commit.
#
# The same pattern can suppress PR checks (i18n-drift, css-class-
# collisions, external-link-arrows, launch-qa-link-check) on the PR
# branch when those PR branches were created via bot identity. Wake
# them the same way: push from your human token. CodeQL is managed by
# the GitHub-default scan and follows the same suppression heuristic.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (incl. Pagefind index)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (sha-pinned)

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (sha-pinned)
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Build Pagefind index (and bio search stubs)
        # scripts/build-search.sh handles both: regenerates the bio
        # stubs from data/bios.json, then runs pagefind against the
        # repo root. Output lands in ./pagefind/ which is gitignored
        # — it ships to Pages via the artifact upload below.
        run: bash scripts/build-search.sh

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5 (sha-pinned)

      - name: Upload Pages artifact
        # path: . uploads the whole working tree, which now includes
        # the freshly-built ./pagefind/. The CNAME file at the root
        # tells Pages the custom domain.
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3 (sha-pinned)
        with:
          path: .

  deploy:
    name: Deploy to github-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4 (sha-pinned)
