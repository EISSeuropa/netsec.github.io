# Archive stale, unmerged branches so the branch list stays signal.
#
# GitHub already deletes a branch the moment its PR merges
# (`delete_branch_on_merge` is on), so shipped work cleans itself up.
# This sweep covers the other case: branches that were never merged
# and have gone quiet (abandoned spikes, parked experiments).
#
# A branch is swept when ALL of these hold:
#   * no new commit in STALE_AFTER_DAYS (14) days,
#   * no open pull request points at it,
#   * it is not the default branch, gh-pages, or an automation
#     branch (anything ending in `/auto`, plus `social/ledger`).
#
# A second pass covers the automation branches the rule above skips.
# `create-pull-request` sets `delete-branch: true`, but the branch
# survives a squash-merge through the auto-merge queue, so leftovers
# accumulate and the next run pushes onto a stale base (#1463). Those
# are deleted on a different signal: their last PR merged and the tip
# has not moved since. Staleness is the wrong test for them, because a
# leftover can be pushed daily and still be a leftover.
#
# "Archive" is non-destructive: before the branch is deleted, a
# lightweight tag `archive/<branch>` is pushed at its tip, so every
# commit survives indefinitely and the work is recoverable with
# `git checkout archive/<branch>`. The branch just leaves the
# branch list. Re-running is safe: an existing archive tag is reused.
#
# Once-daily cadence matches issue-sweep.yml. Zero cost, no API keys.
name: Branch sweep

on:
  schedule:
    - cron: '30 14 * * *'   # Daily 14:30 UTC, just after issue-sweep
  workflow_dispatch:

permissions:
  contents: write          # delete branches + create archive tags
  pull-requests: read      # find branches with an open PR

concurrency:
  group: branch-sweep

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archive + delete stale unmerged branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v7 (sha-pinned)
        with:
          script: |
            const STALE_AFTER_DAYS = 14;

            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            // Never sweep these. Automation branches re-create themselves,
            // gh-pages is the deploy target, the default branch is sacred.
            const isExempt = (name) =>
              name === defaultBranch ||
              name === 'gh-pages' ||
              name === 'social/ledger' ||
              /\/auto$/.test(name);

            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - STALE_AFTER_DAYS);

            // Branches with an open PR are active by definition — collect them.
            const openPrHeads = new Set();
            for (let page = 1; ; page++) {
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 100, page,
              });
              prs.forEach(pr => openPrHeads.add(pr.head.ref));
              if (prs.length < 100) break;
            }

            const counters = { scanned: 0, archived: 0, skipped_recent: 0, skipped_pr: 0,
                               auto_deleted: 0, auto_open_pr: 0, auto_no_merged_pr: 0,
                               auto_moved_since_merge: 0 };

            for (let page = 1; ; page++) {
              const { data: branches } = await github.rest.repos.listBranches({
                owner, repo, per_page: 100, page,
              });
              if (branches.length === 0) break;

              for (const branch of branches) {
                const name = branch.name;
                if (isExempt(name)) continue;
                counters.scanned++;

                if (openPrHeads.has(name)) { counters.skipped_pr++; continue; }

                // Last commit date drives staleness. A branch behind main
                // but freshly pushed is not stale; an old spike is.
                const { data: commit } = await github.rest.repos.getCommit({
                  owner, repo, ref: branch.commit.sha,
                });
                const lastCommit = new Date(
                  commit.commit.committer?.date || commit.commit.author?.date
                );
                if (lastCommit >= cutoff) { counters.skipped_recent++; continue; }

                // Archive: push a lightweight tag at the tip (idempotent),
                // then delete the branch.
                const tag = `archive/${name}`;
                try {
                  await github.rest.git.createRef({
                    owner, repo,
                    ref: `refs/tags/${tag}`,
                    sha: branch.commit.sha,
                  });
                } catch (e) {
                  // 422 = tag already exists (a prior run, or re-pushed
                  // same name). The commits are already preserved, so
                  // proceed to delete. Anything else is a real error.
                  if (e.status !== 422) throw e;
                }

                await github.rest.git.deleteRef({
                  owner, repo, ref: `heads/${name}`,
                });
                counters.archived++;
                console.log(`archived + deleted ${name} (last commit ${lastCommit.toISOString().slice(0, 10)}) → tag ${tag}`);
              }

              if (branches.length < 100) break;
            }

            // ── Pass 2: automation leftovers (#1463) ──────────────────
            //
            // These are exempt above on purpose: they re-create themselves,
            // so "no commit in 14 days" would delete a healthy branch that
            // simply had nothing to sync. The signal here is different, and
            // exact rather than heuristic:
            //
            //   * the branch's most recent PR is merged, and
            //   * the branch tip is still that PR's head commit.
            //
            // The second condition is what makes this safe. If a later run
            // has pushed, the tip has moved and the branch is left alone,
            // so an in-flight sync is never clobbered.
            //
            // Ancestry cannot be used instead: a squash-merge leaves the
            // branch tip unreachable from main, so every one of these reads
            // as "1 ahead" whether it merged or not.
            //
            // Not archived, unlike pass 1. The content is already on main
            // through the squash commit, and a single `archive/<branch>`
            // tag name reused across runs would preserve only the first
            // tip and silently drop the rest. Deleting is also self-healing:
            // the next run re-creates the branch from a fresh main, which
            // is the outcome #1463 wants.
            const isAutomation = (name) =>
              /\/auto$/.test(name) || name === 'social/ledger';

            for (let page = 1; ; page++) {
              const { data: branches } = await github.rest.repos.listBranches({
                owner, repo, per_page: 100, page,
              });
              if (branches.length === 0) break;

              for (const branch of branches) {
                const name = branch.name;
                if (!isAutomation(name)) continue;
                if (openPrHeads.has(name)) { counters.auto_open_pr++; continue; }

                const { data: prs } = await github.rest.pulls.list({
                  owner, repo, state: 'all', head: `${owner}:${name}`,
                  sort: 'updated', direction: 'desc', per_page: 1,
                });
                const last = prs[0];
                if (!last || !last.merged_at) { counters.auto_no_merged_pr++; continue; }
                if (last.head.sha !== branch.commit.sha) {
                  counters.auto_moved_since_merge++;
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner, repo, ref: `heads/${name}`,
                });
                counters.auto_deleted++;
                console.log(`deleted automation leftover ${name} (PR #${last.number} merged ${last.merged_at.slice(0, 10)}, tip unmoved)`);
              }

              if (branches.length < 100) break;
            }

            console.log(`Branch sweep complete. Scanned ${counters.scanned}; ` +
                        `archived ${counters.archived}, ` +
                        `kept ${counters.skipped_recent} recent + ${counters.skipped_pr} with open PR.`);
            console.log(`Automation leftovers: deleted ${counters.auto_deleted}; ` +
                        `kept ${counters.auto_open_pr} with an open PR, ` +
                        `${counters.auto_no_merged_pr} with no merged PR, ` +
                        `${counters.auto_moved_since_merge} pushed since their PR merged.`);
