# Keep the LinkedIn Marketing API version pin current (#1223 follow-up).
#
# Why this exists
#   scripts/social-post.py sends a LinkedIn-Version header pinned in
#   data/linkedin-api-version.json. LinkedIn sunsets a version after ~12
#   months, and a sunset version returns HTTP 426 so every post fails. The
#   pin once sat stale for 13 months and the weekly spotlight silently
#   stopped reaching LinkedIn until a missing post was noticed by hand.
#
# What this does
#   Monthly (and on manual dispatch), read LinkedIn's published active-version
#   list and, when our pin has drifted to the trailing edge of that window,
#   rewrite it to the latest version. Any change ships as an auto-merging PR,
#   so the bump stays visible in git and passes CI before it lands. Most
#   months nothing is due and no PR opens.
#
#   A fetch/parse failure is non-fatal (the script exits 0 without writing),
#   so a flaky doc page never opens a spurious PR. The backstop for an actual
#   sunset between runs is the ::warning:: social-post.py emits when a live
#   post is rejected.
#
# Where to look
#   - Logic + the active-window filter: scripts/check-linkedin-version.py.
#   - The pin: data/linkedin-api-version.json (env LINKEDIN_API_VERSION overrides).
#   - Setup: docs/social-publishing.md.

name: Check LinkedIn API version

on:
  schedule:
    - cron: '0 6 5 * *'    # 5th of each month, 06:00 UTC (a few days after
                           # month start, so the newest version is published)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: linkedin-version-check
  cancel-in-progress: true

jobs:
  check:
    name: Bump the LinkedIn API version pin if due
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Rewrite the pin when a bump is due
        # Pure standard library; no dependency install needed. Prints the pin,
        # the active window, and whether a bump landed, into the run log.
        run: python3 scripts/check-linkedin-version.py --write

      - name: Open an auto-merging PR if the pin changed
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7 (sha-pinned)
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: linkedin-version/auto
          base: main
          delete-branch: true
          add-paths: data/linkedin-api-version.json
          title: 'chore(social): bump LinkedIn API version pin'
          commit-message: |
            chore(social): bump LinkedIn API version pin

            LinkedIn is about to sunset the pinned Marketing API version.
            Auto-generated by the linkedin-version-check workflow (#1223 follow-up).
          body: |
            The pinned LinkedIn Marketing API version in
            `data/linkedin-api-version.json` has drifted to the trailing edge of
            LinkedIn's active-version window, so it is bumped to the current
            latest before it sunsets (a sunset version returns HTTP 426 and the
            weekly spotlight stops reaching LinkedIn).

            The run log above shows the previous pin, the active window read from
            LinkedIn, and the new value. Auto-generated by the
            linkedin-version-check workflow.
          labels: automated

      - name: Arm auto-merge on the pin PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" \
            --squash --auto --repo "${{ github.repository }}"
