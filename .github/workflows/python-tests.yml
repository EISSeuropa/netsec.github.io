name: Python tests

# Runs the scripts/ pytest suites. The suites are named test-<script>.py
# (hyphen) to mirror their hyphenated targets; pytest.ini teaches the
# default collector to pick those up (testpaths=scripts, python_files
# includes test-*.py). Tests are fully mocked, so no network or repo
# mutation happens in CI.
#
# This is a REQUIRED status check (ruleset protect-main). A required
# check that is path-filtered never reports on PRs outside those paths,
# so the merge stays blocked forever: a docs-only or HTML-only PR waits
# indefinitely for a pytest status that never arrives. The pull_request
# trigger therefore runs on every PR. The suite is ~15s and
# side-effect-free, so running it on an unrelated PR costs almost
# nothing. The push trigger stays scoped to changes that can affect the
# suite. See issue #483.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (sha-pinned)
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt pytest pyflakes
      # Undefined names only, not the full pyflakes report: the repo has
      # never been linted, so unused imports and unused locals would fail
      # the gate on day one for findings nobody is about to fix. An
      # undefined name is a guaranteed NameError the moment that line runs,
      # and pytest does not reach most of them. This is the check that
      # would have caught #1758, where a helper lifted out of main() left
      # two call sites reading a variable that had gone local with it.
      - name: Check for undefined names
        run: |
          python -m pyflakes $(git ls-files '*.py') > pyflakes.txt || true
          if grep 'undefined name' pyflakes.txt; then
            echo "::error::pyflakes found undefined name(s) — see above."
            exit 1
          fi
      - name: Run the script test suites
        run: python -m pytest -q
