# Check the LinkedIn and Bluesky credentials in an environment, without
# posting and without printing a secret (EISSeuropa/EISSeuropa.github.io has
# the same check).
#
# Run by hand from the Actions tab when a post fails at sign-in. Pick
# `social` (the approval-gated news and thread posts, social-bluesky.yml) or
# `social-auto` (the weekly spotlight, spotlight-rotate.yml). The job targets
# that environment, so `social` waits for the same approval as a post. The run
# summary lists each value with ✅ or ❌ and what to replace
# (scripts/check-social-credentials.py). The job fails when any check fails.
#
# SHA-pinned actions per .github/CLAUDE.md.
name: Check the LinkedIn and Bluesky credentials

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's secrets to check
        type: choice
        options:
          - social
          - social-auto
        default: social

permissions:
  contents: read

jobs:
  check:
    name: Check the credentials
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 (sha-pinned)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Check each credential
        env:
          SOCIAL_ENVIRONMENT: ${{ inputs.environment }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python3 scripts/check-social-credentials.py
