# Calendar drift check.
#
# Runs scripts/build-calendar.py --check on every PR that touches
# data/events.json, calendar.ics, any calendar/<slug>.ics, or the
# generator itself. If any committed output is out of step with what
# the script would produce from data/events.json — including stale
# per-event files for events that have been removed — this check fails
# and the PR can't be merged until the maintainer runs
# `python3 scripts/build-calendar.py` and commits the result.
#
# That guarantees both the public subscribable feed (calendar.ics) and
# the per-event "Add to calendar" downloads (calendar/<slug>.ics) stay
# in step with the JSON source of truth — a maintainer editing
# data/events.json without regenerating the .ics files will get a
# clear error before merge, rather than silently shipping a stale
# calendar to subscribers or a 404'd per-event button.
#
# Zero cost: no third-party services, no API keys.
name: Calendar drift check

on:
  pull_request:
    paths:
      - 'data/events.json'
      - 'calendar.ics'
      - 'calendar/**'
      - 'scripts/build-calendar.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Check calendar drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Run drift checker
        run: python3 scripts/build-calendar.py --check
