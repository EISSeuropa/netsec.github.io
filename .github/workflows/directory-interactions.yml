# Interaction smoke tests for the Directory (people.html).
#
# Drives the real page in headless Chrome (puppeteer-core against the
# runner's preinstalled Chrome) and asserts the interaction-level contract
# the structural gates cannot see: every active filter shows a pressed
# control, the mentorship wizard reflects every selection, its area popover
# survives being scrolled, and dark-mode badges stay readable. Each journey
# is a regression tripwire for a bug class that previously shipped through
# a green build (#1376, #1380, #1382, #1383).
name: directory interactions

# Runs on every pull request, deliberately. This job is a required check in
# the `protect-main` ruleset, and a path-filtered workflow never reports on a
# PR that misses its filter, which leaves that PR blocked on a check that will
# never arrive. The other required checks (`pytest`, `Check SEO + asset
# version drift`) trigger unfiltered for the same reason. The cost is about a
# minute on PRs that could not have broken the directory, which is the price
# of a gate that cannot be silently skipped.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4 (sha-pinned)
        with:
          node-version: '22'

      - name: Install puppeteer-core
        run: npm ci --no-audit --no-fund

      # ./pagefind/ is gitignored and built at deploy time, so a checkout has
      # no index and every search journey would time out against an overlay
      # stuck on its load-error message (#1404 shipped that way). The same
      # script the deploy runs builds it here.
      - name: Build the Pagefind index
        run: bash scripts/build-search.sh

      - name: Run directory interaction journeys
        run: node scripts/test-directory-interactions.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
