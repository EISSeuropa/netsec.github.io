name: Lighthouse (budgets)

# Performance / accessibility / SEO budget gate (#270). Serves the
# static site, runs Lighthouse against the key pages, and asserts the
# thresholds in lighthouserc.json. Three runs per URL keep shared-
# runner variance from flaking the result, and the thresholds sit
# below the day-to-day scores on purpose: the gate catches collapses
# (a megabyte image landing on a page, a render-blocking regression),
# not noise.
#
# This check is NOT in the required set, so a red run signals without
# blocking auto-merge. If it goes red on your PR, open the uploaded
# report artifact, find the failed assertion, and fix it (or record
# why it is acceptable) before merging anyway.
#
# network-map.html joined the set in July 2026 (#764). It is the one page doing
# sustained canvas work, and it was previously unmeasured even though this
# workflow already triggered on the files that build it. Its assertions
# differ in one respect only, documented in lighthouserc.json.

on:
  pull_request:
    paths:
      - '**.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)
      - name: Serve the static site
        # Backgrounded; the runner VM keeps it alive for the next step.
        #
        # scripts/serve-static.cjs rather than `python3 -m http.server`,
        # which serves HTTP/1.0 with neither compression nor range support
        # (#1617). GitHub Pages does both, so the audit was measuring a
        # transport the site never runs on: uses-text-compression came out
        # as the home page's single largest opportunity at 2.8s even though
        # production gzips everything it named, and the ESSC recap video
        # reported a 24.9MB transfer because a metadata-only preload cannot
        # range-request its way to a trailing moov atom.
        #
        # Node is already on the runner for lhci, and the server has no
        # dependencies, so this costs nothing to install.
        run: |
          node scripts/serve-static.cjs 8080 . &
          # Poll rather than sleep. `sleep 3` lost the race on 27 August 2026
          # and the audit failed with "Failed to connect to localhost port
          # 8080", which reads as a broken build rather than a slow start
          # (#1713).
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8080/index.html 2>/dev/null && break
            sleep 0.5
          done
          # Fail loudly here rather than letting Lighthouse audit six 404s.
          curl -fsS -o /dev/null http://localhost:8080/index.html
          curl -fsS -o /dev/null -H 'Accept-Encoding: gzip' \
            -D /tmp/h http://localhost:8080/assets/css/site.css
          grep -qi 'content-encoding: gzip' /tmp/h \
            || { echo '::error::static server is not compressing'; exit 1; }
      - name: Run Lighthouse with budget assertions
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12 (sha-pinned)
        with:
          urls: |
            http://localhost:8080/index.html
            http://localhost:8080/people.html
            http://localhost:8080/about.html
            http://localhost:8080/essc-2026.html
            http://localhost:8080/press-kit.html
            http://localhost:8080/network-map.html
          runs: 3
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
