name: Lighthouse (budgets)

# Performance / accessibility / SEO budget gate (#270). Serves the
# static site, runs Lighthouse against the key pages, and asserts the
# thresholds in lighthouserc.json. Three runs per URL keep shared-
# runner variance from flaking the result, and the thresholds sit
# below the day-to-day scores on purpose: the gate catches collapses
# (a megabyte image landing on a page, a render-blocking regression),
# not noise.
#
# This check is NOT in the required set, so a red run signals without
# blocking auto-merge. If it goes red on your PR, open the uploaded
# report artifact, find the failed assertion, and fix it (or record
# why it is acceptable) before merging anyway.
#
# atlas.html joined the set in July 2026 (#764). It is the one page doing
# sustained canvas work, and it was previously unmeasured even though this
# workflow already triggered on the files that build it. Its assertions
# differ in one respect only, documented in lighthouserc.json.

on:
  pull_request:
    paths:
      - '**.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)
      - name: Serve the static site
        # Backgrounded; the runner VM keeps it alive for the next step.
        run: |
          python3 -m http.server 8080 --directory . &
          sleep 3
      - name: Run Lighthouse with budget assertions
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12 (sha-pinned)
        with:
          urls: |
            http://localhost:8080/index.html
            http://localhost:8080/people.html
            http://localhost:8080/about.html
            http://localhost:8080/essc-2026.html
            http://localhost:8080/press-kit.html
            http://localhost:8080/atlas.html
          runs: 3
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
