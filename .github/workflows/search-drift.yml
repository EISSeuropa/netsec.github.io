# Pagefind build sanity check.
#
# Since the search index is built at deploy time (see
# .github/workflows/pages-deploy.yml) and is no longer committed to
# main, the old "committed index vs fresh build" page-count drift
# check became moot. What we still want on every PR that touches
# searchable content is: confirm the build succeeds, produces a
# valid pagefind-entry.json, and indexes at least one page per
# locale. That catches the realistic regressions:
#
#   - a syntax error in HTML that makes Pagefind silently skip a page
#   - a forgotten `<main data-pagefind-body>` marker on a new page
#   - a build-script regression that produces an empty index
#
# Content-level drift (an edit inside an existing page) is no longer
# a CI concern — the deploy workflow always rebuilds the index from
# the current main, so the live site can't be stale relative to source.
name: Pagefind build sanity check

on:
  pull_request:
    paths:
      - '*.html'
      - 'data/bios.json'
      - 'scripts/build-search.sh'
      - 'scripts/build-bio-search-stubs.py'
      - 'assets/js/site.js'
      - '.github/workflows/search-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify Pagefind builds and indexes content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Pagefind index
        run: bash scripts/build-search.sh

      - name: Verify per-locale page counts are non-zero
        run: |
          python3 - <<'PY'
          import json, sys
          entry = json.load(open('pagefind/pagefind-entry.json'))
          langs = entry.get('languages', {})
          if not langs:
              sys.exit('FAIL: no languages indexed')
          failed = False
          for lang, meta in langs.items():
              n = meta.get('page_count', 0)
              if n == 0:
                  print(f'FAIL: {lang} shard has 0 pages')
                  failed = True
              else:
                  print(f'  {lang}: {n} pages')
          if failed:
              sys.exit(1)
          PY
