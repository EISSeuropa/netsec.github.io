# Search-index page-count check.
#
# Runs scripts/build-search.sh --check on every PR that touches
# searchable HTML, the committed index, the builder script, or the
# JS that consumes the index. The check builds a fresh Pagefind
# index in /tmp and compares its per-language page_count against
# the committed pagefind-entry.json — fails if they differ.
#
# Why page counts, not a byte diff:
#   Pagefind's per-platform WASM build is non-deterministic between
#   Linux (CI) and macOS (typical local). The WASM binaries and
#   shard hashes differ across platforms even when the content is
#   identical — both versions work in any browser at runtime, but
#   they wouldn't byte-equal. Page counts ARE deterministic and
#   catch the most common "forgot to rebuild" mistake (adding /
#   removing an indexable page).
#
# Content edits inside an existing page are NOT caught by this CI
# check — the maintainer must remember to ./scripts/build-search.sh
# after content edits. The architecture doc spells this out.
name: Search-index page-count check

on:
  pull_request:
    paths:
      - '*.html'
      - 'pagefind/**'
      - 'scripts/build-search.sh'
      - 'assets/js/site.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Check search-index page counts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run page-count check
        run: ./scripts/build-search.sh --check
