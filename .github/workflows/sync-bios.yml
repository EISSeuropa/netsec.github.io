# Weekly sync of data/bios.json from the NetSec member bios Google Form.
#
# What this does
#   1. Every Monday at 05:15 UTC (15 min after the cost.eu sync so it
#      can pick up any WG changes already merged), and on manual
#      dispatch, fetch the linked Google Sheet as CSV.
#   2. Parse each row into the bios.json schema, download any new
#      headshots from Google Drive, write data/bios.json.
#   3. If anything changed, open or update a pull request on the
#      branch `bios-sync/auto` with the human-readable diff in the
#      body. If nothing changed, exit silently — no inbox noise.
#   4. While scripts/bios-source.json has no csv_url set (initial
#      state), the script no-ops cleanly so the workflow stays green
#      while the Google Form is still being set up.
#
# Where to look
#   - The sync logic lives in scripts/sync-bios.py.
#   - The sheet URL + column mapping live in scripts/bios-source.json.
#   - Set-up steps: docs/bios-setup.md.

name: Sync member bios from Google Form

on:
  schedule:
    - cron: '15 5 * * 1'   # Every Monday 05:15 UTC
  workflow_dispatch:       # Manual run from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bios-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh bios.json from Google Sheet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v4 (sha-pinned)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5 (sha-pinned)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync script and capture diff
        env:
          # The sync script writes a dynamic title + a Markdown overview
          # of what changed (new members, updates, headshot replacements,
          # removals) to these paths. The next two steps read them. Left
          # unset on local invocations, in which case the script no-ops
          # the writes silently.
          SYNC_BIOS_PR_TITLE_PATH: /tmp/sync-bios-pr-title.txt
          SYNC_BIOS_PR_OVERVIEW_PATH: /tmp/sync-bios-pr-overview.md
        run: |
          set -o pipefail
          python3 scripts/sync-bios.py | tee /tmp/sync-bios.txt
          # sync-bios edits data/bios.json (not the HTML files) so it
          # rarely drifts the HTML translations directly. The drift
          # report is included for completeness, and to surface cases
          # where someone edited an HTML file in the same auto-branch
          # as a sync (e.g. ad-hoc admin work).
          python3 scripts/check-i18n-drift.py > /tmp/drift-bios.txt 2>&1 || true
          {
            if [ -s /tmp/sync-bios-pr-overview.md ]; then
              cat /tmp/sync-bios-pr-overview.md
              echo ""
            fi
            echo "## Run log"
            echo ""
            echo '```'
            cat /tmp/sync-bios.txt
            echo '```'
            echo ""
            echo "## Translation drift snapshot"
            echo ""
            echo '```'
            cat /tmp/drift-bios.txt
            echo '```'
            echo ""
            echo "---"
            echo "_Source: linked Google Sheet via \`scripts/bios-source.json\`._"
            echo "_Workflow: **Sync member bios from Google Form**, run_id \`${{ github.run_id }}\`, trigger \`${{ github.event_name }}\`._"
          } > /tmp/bios-pr-body.md

      - name: Refresh ORCID works from the updated roster
        run: |
          # For each member carrying an ORCID iD, fetch their most recent
          # works into data/orcid-works.json (#761). Reads the bios.json
          # just written above. Fails soft per member, so an ORCID outage
          # loses at most that member's publications for the week and a
          # total outage carries the previous file over untouched. The
          # file rides this same auto-PR. Idempotent: no change, no diff.
          python3 scripts/sync-orcid.py

      - name: Regenerate per-member OG cards (#1023)
        run: |
          # Render the OG card image for any member whose card inputs changed
          # (manifest-keyed, so unchanged cards are not re-rendered and the PR
          # stays churn-free). Runs BEFORE the profile-page rebuild so a new
          # member's og:image points at their freshly built card. Chrome is
          # preinstalled on the runner (same as the render smoke test).
          python3 scripts/build-og-cards.py

      - name: Rebuild member profile pages from the refreshed bios
        run: |
          # The /people/<slug> profile pages (#762) are generated from
          # data/bios.json + data/orcid-works.json + the people.* shells.
          # Regenerate so a new member, headshot, or works list reaches
          # their page in the same weekly auto-PR. Idempotent: unchanged
          # pages produce no diff. A drift gate (data-shape-check.yml)
          # blocks a stale set from merging.
          python3 scripts/build-profile-pages.py

      - name: Regenerate sitemap.xml from the refreshed member set
        run: |
          # sitemap.xml lists every /people/<slug> profile page (#1027).
          # Run after the profile pages are rebuilt so a new member's URL
          # lands in the sitemap in the same weekly auto-PR. Idempotent;
          # the drift gate (data-shape-check.yml) blocks a stale sitemap.
          python3 scripts/build-sitemap.py

      - name: Rebuild the glossary field guide from the refreshed bios
        run: |
          # The field-guide facepile (#801) is baked from data/bios.json at
          # build time, so a member's new keywords or headshot only reach the
          # glossary once this reruns. Bundling it into the sync PR keeps the
          # faces at most one weekly cycle behind the directory data. The
          # build is idempotent, so it adds nothing when the facepiles are
          # unchanged. It rewrites only the field-guide region of the
          # glossary pages, leaving the ?v= asset hashes untouched.
          python3 scripts/build-field-guide.py

      - name: Compose PR title (dynamic if available, fallback otherwise)
        id: pr-title
        run: |
          if [ -s /tmp/sync-bios-pr-title.txt ]; then
            title=$(head -n 1 /tmp/sync-bios-pr-title.txt)
          else
            title='data: sync member bios from Google Form'
          fi
          # GitHub PR title cap is 256 chars; trim defensively.
          title=${title:0:240}
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Open or update PR if bios.json changed
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7 (sha-pinned)
        with:
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: bios-sync/auto
          base: main
          delete-branch: true
          title: ${{ steps.pr-title.outputs.title }}
          commit-message: |
            ${{ steps.pr-title.outputs.title }}

            Auto-generated by the bios sync workflow.
            See the PR body for the full diff and run log.
          body-path: /tmp/bios-pr-body.md
          labels: |
            automated
            data-sync
          # Assign the maintainer as reviewer so GitHub emails +
          # mobile push the auto-PR opening. The PR auto-merges
          # via the next step regardless; the reviewer line is
          # purely for the change-awareness signal.
          reviewers: APB-LDN

      # Auto-merge so weekly form-submission batches ship without
      # manual review. Branch protection still requires CodeQL +
      # link-check + i18n-drift + Pagefind to pass; a failing check
      # blocks the merge until the maintainer investigates. Skipped
      # when the previous step found nothing to PR (no diff this run).
      - name: Arm auto-merge on the auto-PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge \
            "${{ steps.create-pr.outputs.pull-request-number }}" \
            --squash --auto \
            --repo "${{ github.repository }}"
