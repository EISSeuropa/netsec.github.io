# Auto-refresh the `[Unreleased]` autostamp in docs/roadmap-2026.md.
#
# What this does
#   - Reads CHANGELOG.md, counts the bullets under [Unreleased]
#     per category, finds the most recent SemVer tag.
#   - Rewrites the AUTOSTAMP block in docs/roadmap-2026.md with
#     the result.
#   - Opens a PR on `roadmap-sync/auto` (auto-merge armed) if the
#     stamp moved. If nothing changed, the workflow is a no-op.
#
# What this does NOT do
#   - Touch the prose timeline rows. Those stay maintainer-written;
#     the autostamp surfaces staleness without claiming to fix it.
#   - Promote shipped releases from 📅 to ✅. That's release.sh's
#     responsibility and a §5 cross-check item.
#   - Touch /roadmap.html (public-facing); that's a release-time
#     edit per the Sync convention at the top of roadmap-2026.md.
#
# Why
#   The roadmap doc used to drift between releases because no
#   codified rule fired between v<n> shipping and v<n+1> being
#   cut. Per CLAUDE.md §11 the threshold + calendar trigger
#   options were rejected on "will the maintainer actually do
#   this" grounds. Automating the cheap part (the count + the
#   freshness date) removes the burden without forcing prose
#   regeneration.

name: Sync roadmap autostamp

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'docs/roadmap-2026.md'
      - 'scripts/sync-roadmap.py'
      - '.github/workflows/sync-roadmap.yml'
  # Weekly belt-and-braces in case a push trigger ever misses
  # (e.g. workflow disabled momentarily for a fix). 06:00 UTC
  # Monday, sequenced after sync-bios (05:15) and sync-indico.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: roadmap-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh autostamp in docs/roadmap-2026.md
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so `git tag --list --sort=-v:refname` sees
          # the full tag history. Shallow clones default to depth 1
          # which loses tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh autostamp
        run: |
          set -o pipefail
          python3 scripts/sync-roadmap.py | tee /tmp/sync-roadmap.txt
          {
            echo "Auto-generated update to \`docs/roadmap-2026.md\`'s"
            echo "machine-managed \`[Unreleased]\` autostamp."
            echo ""
            echo "Script output:"
            echo ""
            echo '```'
            cat /tmp/sync-roadmap.txt
            echo '```'
            echo ""
            echo "The autostamp counts bullets in \`CHANGELOG.md\`'s"
            echo "\`[Unreleased]\` section per category and freshness-stamps"
            echo "the date. The prose in the timeline rows themselves is"
            echo "untouched; refreshing that synthesis is a maintainer call"
            echo "at release-time §5 sweep."
            echo ""
            echo "---"
            echo "_Workflow: **Sync roadmap autostamp**, run_id \`${{ github.run_id }}\`, trigger \`${{ github.event_name }}\`._"
          } > /tmp/roadmap-sync-pr-body.md

      - name: Open or update PR if autostamp changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: roadmap-sync/auto
          base: main
          delete-branch: true
          title: 'docs(roadmap): refresh [Unreleased] autostamp'
          commit-message: |
            docs(roadmap): refresh [Unreleased] autostamp

            Auto-generated by scripts/sync-roadmap.py.
            See the PR body for the stamp delta.
          body-path: /tmp/roadmap-sync-pr-body.md
          labels: |
            automated
            documentation
