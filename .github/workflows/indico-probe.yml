# One-shot manual probe to discover the actual response shapes of
# Indico's management API endpoints we couldn't validate from local
# during Phase 1 of #210 (the write-token only exists as a GH
# Actions secret on this repo, so the probe has to run here).
#
# Read-only: every request is a GET. The probe never mutates data.
#
# Trigger manually via the Actions tab → "Indico API probe" → Run
# workflow. The job log carries the structured report; copy/paste
# it into the #210 conversation to drive the next iteration of
# scripts/indico_patch.py.
#
# Delete this workflow once Phase 1.5 lands. It's a one-shot tool.
name: Indico API probe (Phase 1.5)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run probe
        env:
          INDICO_WRITE_TOKEN: ${{ secrets.INDICO_WRITE_TOKEN }}
        run: python3 scripts/indico_probe.py
