# Phase 1.5 write-confirm — final check before un-parking
# scripts/indico_patch.py. See #210.
name: Indico API probe (Phase 1.5 write-confirm)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run probe
        env:
          INDICO_WRITE_TOKEN: ${{ secrets.INDICO_WRITE_TOKEN }}
        run: python3 scripts/indico_probe.py
