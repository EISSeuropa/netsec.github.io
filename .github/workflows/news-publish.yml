# Issue-driven news publishing, ported from the EISS repository
# (EISSeuropa/EISSeuropa.github.io, news-publish.yml, #2058).
#
# A News item issue (.github/ISSUE_TEMPLATE/news.yml) becomes a PR. The run
# starts when a publisher files the form, or when a publisher applies the
# `news` label to a form issue someone else filed. scripts/news-from-issue.py
# adds the item to data/news.json with French and German machine translations
# from the Claude API, build-news-rss.py rebuilds news.xml, and the run opens
# a PR with `Closes #<issue>`.
#
# The PR waits for the maintainer, who reads it and merges it. Merging
# approves the machine translations (CLAUDE.md §1), publishes the item, and the
# news.xml change on main starts the gated social posts (social-bluesky.yml).
#
# Publishers are the accounts in the repository variable NEWS_PUBLISHERS
# (GitHub logins, separated by commas, semicolons or spaces). An issue opened
# by anyone else is left for a publisher to label, with no comment. A label
# applied by anyone else gets a comment saying nothing was published. With the
# variable unset, nobody can publish.
#
# Action pins mirror the other workflows (SHA-pinned, .github/CLAUDE.md).

name: Publish news from issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: news-publish-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Add the news item and open a PR
    # A form issue starts with its Site field. Any other new issue is ignored.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'news')
      || (github.event.action == 'opened' && startsWith(github.event.issue.body, '### Site'))
    runs-on: ubuntu-latest
    steps:
      - name: Check the publisher
        id: publisher
        env:
          PUBLISHERS: ${{ vars.NEWS_PUBLISHERS }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          allowed=false
          for login in $(echo "$PUBLISHERS" | tr ',;' '  '); do
            if [ "${login,,}" = "${SENDER,,}" ]; then allowed=true; fi
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" != true ]; then
            echo "::notice::$SENDER is not in NEWS_PUBLISHERS. Nothing published."
          fi

      - name: Tell the issue why nothing was published
        if: steps.publisher.outputs.allowed != 'true' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "@$SENDER applied \`news\`, but only the accounts in the NEWS_PUBLISHERS repository variable can publish. Nothing was published. A publisher can remove and re-apply the label."

      - name: Check out repository
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)

      - name: Set up Python
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      - name: Install the Claude API client
        if: steps.publisher.outputs.allowed == 'true'
        run: python -m pip install --quiet anthropic==2.8.0

      - name: Add the news item and rebuild the feed
        if: steps.publisher.outputs.allowed == 'true'
        id: item
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          export TODAY="$(TZ=Europe/Paris date +%F)"
          python3 scripts/news-from-issue.py | tee /tmp/news-add.txt
          python3 scripts/build-news-rss.py
          {
            echo "Generated from issue #${ISSUE_NUMBER}, filed by @${ISSUE_AUTHOR}. Merging this PR publishes the item and queues the social posts for approval."
            echo ""
            if grep -q '^TRANSLATED=false' /tmp/news-add.txt; then
              echo "The French and German text is missing, so the FR and DE pages would show English. Add \`fr\` and \`de\` to the title, summary and body in \`data/news.json\` (by hand or by machine), then merge."
            else
              echo "The French and German title, summary and body are machine translations (Claude API). Merging approves them (CLAUDE.md §1)."
            fi
            echo ""
            echo "Script output:"
            echo ""
            echo '```'
            cat /tmp/news-add.txt
            echo '```'
            echo ""
            echo "Edit the entry in \`data/news.json\` on this branch to change anything, then run \`python3 scripts/build-news-rss.py\`."
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/news-pr-body.md

      - name: Open or update the news PR
        if: steps.publisher.outputs.allowed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v7 (sha-pinned)
        with:
          # The AUTOPR_TOKEN makes the PR run the required checks. A
          # GITHUB_TOKEN PR starts none of them.
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: news/auto-${{ github.event.issue.number }}
          base: main
          delete-branch: true
          title: 'content(news): ${{ github.event.issue.title }}'
          commit-message: |
            content(news): publish item from issue #${{ github.event.issue.number }}

            Added to data/news.json by scripts/news-from-issue.py, with
            news.xml rebuilt by scripts/build-news-rss.py.
          body-path: /tmp/news-pr-body.md
          labels: |
            automated
