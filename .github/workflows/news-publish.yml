# Issue-driven news publishing, ported from the EISS repository
# (EISSeuropa/EISSeuropa.github.io, news-publish.yml, #2058).
#
# A News item issue (.github/ISSUE_TEMPLATE/news.yml) becomes a PR. The run
# starts when a publisher files the form, or when a publisher applies the
# `news` label to a form issue someone else filed. A publisher's edit to an
# open form issue starts it again and rebuilds the PR (anyone else's edit,
# or an edit to a closed issue whose item has merged, starts nothing). scripts/news-from-issue.py
# adds the item to data/news.json with French and German machine translations
# from the Claude API, build-news-rss.py rebuilds news.xml, and the run opens
# a PR with `Closes #<issue>`.
#
# The PR waits for the maintainer, who reads it and merges it. Merging
# approves the machine translations (CLAUDE.md §1), publishes the item, and the
# news.xml change on main starts the gated social posts (social-bluesky.yml).
# The PR is assigned to the accounts in the repository variable NEWS_APPROVERS,
# so GitHub notifies them. A collaborator among them can merge it once its
# checks pass (#2164).
#
# A run that fails says so on the issue, with a link to the run (#2163). When
# the script stopped on the form's content (an empty or too long headline or
# summary, Site set to EISS), the comment quotes its reason and says how to try
# again (EISSeuropa/EISSeuropa.github.io#2191).
#
# Publishers are the accounts in the repository variable NEWS_PUBLISHERS
# (GitHub logins, separated by commas, semicolons or spaces). An issue opened
# by anyone else is left for a publisher to label, with no comment. A label
# applied by anyone else gets a comment saying nothing was published. With the
# variable unset, nobody can publish.
#
# Action pins mirror the other workflows (SHA-pinned, .github/CLAUDE.md).

name: Publish news from issue

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: news-publish-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Add the news item and open a PR
    # A form issue starts with its Site field. Any other new issue is ignored.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'news')
      || (github.event.action == 'opened' && startsWith(github.event.issue.body, '### Site'))
      || (github.event.action == 'edited' && github.event.issue.state == 'open'
          && startsWith(github.event.issue.body, '### Site'))
    runs-on: ubuntu-latest
    steps:
      # The label this pipeline listens for, made here so nobody has to make
      # it by hand and a deleted one comes back (#2169). An existing label
      # makes `gh label create` fail, which is the expected case.
      - name: Create the news label if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh label create news --color 0e8a16 --description "Publishes a News item issue as a PR" 2>/dev/null || true

      - name: Check the publisher
        id: publisher
        env:
          PUBLISHERS: ${{ vars.NEWS_PUBLISHERS }}
          APPROVERS: ${{ vars.NEWS_APPROVERS }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          # Comma-separated, as the PR step's `assignees` takes them.
          echo "approvers=$(echo "$APPROVERS" | tr -s ';, ' ',' | sed 's/^,//; s/,$//')" >> "$GITHUB_OUTPUT"
          allowed=false
          for login in $(echo "$PUBLISHERS" | tr ',;' '  '); do
            if [ "${login,,}" = "${SENDER,,}" ]; then allowed=true; fi
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" != true ]; then
            echo "::notice::$SENDER is not in NEWS_PUBLISHERS. Nothing published."
          fi

      - name: Tell the issue why nothing was published
        if: steps.publisher.outputs.allowed != 'true' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "@$SENDER applied \`news\`, but only the accounts in the NEWS_PUBLISHERS repository variable can publish. Nothing was published. A publisher can remove and re-apply the label."

      - name: Check out repository
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (sha-pinned)

      - name: Set up Python
        if: steps.publisher.outputs.allowed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (sha-pinned)
        with:
          python-version: '3.12'

      # The Claude API client for the translations, and Pillow
      # (scripts/requirements.txt) to shrink the item's photo.
      - name: Install the Claude API client and the script requirements
        if: steps.publisher.outputs.allowed == 'true'
        run: python -m pip install --quiet anthropic==2.8.0 -r scripts/requirements.txt

      - name: Add the news item and rebuild the feed
        if: steps.publisher.outputs.allowed == 'true'
        id: item
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          export TODAY="$(TZ=Europe/Paris date +%F)"
          # stderr holds the reason a run stops, written for the person who
          # filed the form. Only when the script fails does it go to
          # /tmp/news-error.txt, which the failure step posts on the issue.
          python3 scripts/news-from-issue.py 2>/tmp/news-stderr.txt | tee /tmp/news-add.txt \
            || { cp /tmp/news-stderr.txt /tmp/news-error.txt; cat /tmp/news-stderr.txt >&2; exit 1; }
          cat /tmp/news-stderr.txt >&2
          python3 scripts/build-news-rss.py
          {
            echo "Generated from issue #${ISSUE_NUMBER}, filed by @${ISSUE_AUTHOR}. Merging this PR publishes the item and queues the social posts for approval."
            echo ""
            if grep -q '^TRANSLATED=false' /tmp/news-add.txt; then
              echo "The French and German text is missing, so the FR and DE pages would show English. Add \`fr\` and \`de\` to the title, summary and body in \`data/news.json\` (by hand or by machine), then merge."
            else
              echo "The French and German title, summary and body are machine translations (Claude API). Merging approves them (CLAUDE.md §1)."
            fi
            echo ""
            if grep -q 'photo saved as' /tmp/news-add.txt; then
              echo "The photo is in the Files changed tab. The post preview gives its description, read aloud to people who cannot see it."
              echo ""
            elif ! grep -q 'already in data/news.json' /tmp/news-add.txt; then
              echo "No photo: the posts use the event card, or the NetSec card when the item links to no event. To add a photo, a publisher edits issue #${ISSUE_NUMBER} and drags it into the Image box, which rebuilds this PR."
              echo ""
            fi
            echo "Script output:"
            echo ""
            echo '```'
            cat /tmp/news-add.txt
            echo '```'
            echo ""
            echo "Edit the entry in \`data/news.json\` on this branch to change anything, then run \`python3 scripts/build-news-rss.py\`."
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/news-pr-body.md

      # The form's "Add a title" box mostly stays "news:", so the issue takes
      # the headline's name. GITHUB_TOKEN's edit starts no new run.
      - name: Name the issue after the headline
        if: steps.publisher.outputs.allowed == 'true' && steps.item.outputs.headline != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEADLINE: ${{ steps.item.outputs.headline }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          want="news: $HEADLINE"
          if [ "$TITLE" != "$want" ]; then
            gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --title "$want"
          fi

      - name: Open or update the news PR
        if: steps.publisher.outputs.allowed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v7 (sha-pinned)
        with:
          # The AUTOPR_TOKEN makes the PR run the required checks. A
          # GITHUB_TOKEN PR starts none of them.
          token: ${{ secrets.AUTOPR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: news/auto-${{ github.event.issue.number }}
          base: main
          delete-branch: true
          title: 'content(news): ${{ steps.item.outputs.headline || github.event.issue.title }}'
          commit-message: |
            content(news): publish item from issue #${{ github.event.issue.number }}

            Added to data/news.json by scripts/news-from-issue.py, with
            news.xml rebuilt by scripts/build-news-rss.py.
          body-path: /tmp/news-pr-body.md
          assignees: ${{ steps.publisher.outputs.approvers }}
          labels: |
            automated

      - name: Tell the issue that the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A crash (a traceback) or a fault in the repository (a message
          # prefixed "news-from-issue:") gets the generic message instead.
          if [ -s /tmp/news-error.txt ] && ! grep -q -e Traceback -e '^news-from-issue:' /tmp/news-error.txt; then
            body="@$SENDER nothing was published. $(cat /tmp/news-error.txt)

          To edit the issue, open the ··· menu at the top right of its first message and choose Edit. Saving the edit starts a new run when a publisher makes it. Otherwise a publisher removes the \`news\` label and applies it again. The run: $RUN_URL"
          else
            body="@$SENDER the run that turns this issue into a news PR failed, so nothing was published. The maintainer has been notified. The run: $RUN_URL"
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$body"
