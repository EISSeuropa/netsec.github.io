# News-RSS drift check.
#
# Runs scripts/build-news-rss.py --check on every PR that touches
# data/news.json, news.xml, or the generator itself. If the committed
# news.xml doesn't match what the script would produce from
# data/news.json, this check fails and the PR can't be merged until
# the maintainer runs `python3 scripts/build-news-rss.py` and commits
# the result.
#
# Mirrors the calendar-drift workflow shape. Same rationale: the
# JSON is the source of truth; the rendered feed is a derived view;
# CI gate prevents silent drift.
#
# Zero cost: no third-party services, no API keys.
name: News RSS drift check

on:
  pull_request:
    paths:
      - 'data/news.json'
      - 'news.xml'
      - 'scripts/build-news-rss.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    uses: ./.github/workflows/_pycheck.yml
    with:
      command: python3 scripts/build-news-rss.py --check
